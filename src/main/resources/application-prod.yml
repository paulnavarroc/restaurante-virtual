spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      pool-name: HikariPool-Prod

  jpa:
    show-sql: false

  thymeleaf:
    cache: true

logging:
  level:
    root: INFO
    com.saboresperu.restaurante: INFO