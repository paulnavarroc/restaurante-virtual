<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Carrito</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Carrito</h1>
            <p class="text-sm text-slate-500">Revisa tu pedido antes de continuar</p>
        </div>
        <a th:href="@{/menu}" class="text-sm font-medium text-sky-600 hover:text-sky-700">
            <i class="bi bi-arrow-left"></i> Seguir comprando
        </a>
    </div>

    <div th:if="${cart == null or cart.empty}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white p-12 text-center">
        <i class="bi bi-cart-x text-4xl text-slate-300"></i>
        <p class="mt-3 font-medium text-slate-700">Tu carrito está vacío</p>
        <a th:href="@{/menu}"
           class="mt-4 inline-flex rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Ir al menú
        </a>
    </div>

    <div th:unless="${cart == null or cart.empty}" class="grid gap-6 lg:grid-cols-3">
        <div class="space-y-3 lg:col-span-2">
            <article th:each="item : ${cart.items}"
                     class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:flex-row sm:items-center">
                <div class="flex h-20 w-20 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-slate-100">
                    <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                         th:src="${item.imageUrl}" th:alt="${item.productName}"
                         class="h-full w-full object-cover">
                    <i th:unless="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                       class="bi bi-egg-fried text-2xl text-slate-300"></i>
                </div>

                <div class="min-w-0 flex-1">
                    <h2 class="font-semibold text-slate-900" th:text="${item.productName}">Producto</h2>
                    <p class="text-sm text-slate-500"
                       th:text="${'S/ ' + #numbers.formatDecimal(item.unitPrice, 1, 2) + ' c/u'}">Precio</p>
                </div>

                <form th:action="@{/customer/cart/items/update}" method="post" class="flex items-center gap-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="productId" th:value="${item.productId}"/>
                    <input type="hidden" name="dailyMenuItemId" th:value="${item.dailyMenuItemId}"/>
                    <label class="sr-only" th:for="'qty-' + ${item.productId}">Cantidad</label>
                    <input type="number" name="quantity" min="1" max="99"
                           th:id="'qty-' + ${item.productId}"
                           th:value="${item.quantity}"
                           class="w-16 rounded-lg border border-slate-300 px-2 py-1.5 text-center text-sm
                                  focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                    <button type="submit"
                            class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm text-slate-600 hover:bg-slate-50">
                        Actualizar
                    </button>
                </form>

                <div class="text-right">
                    <p class="font-bold text-slate-900"
                       th:text="${'S/ ' + #numbers.formatDecimal(item.lineTotal, 1, 2)}">Total línea</p>
                    <form th:action="@{/customer/cart/items/remove}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <input type="hidden" name="dailyMenuItemId" th:value="${item.dailyMenuItemId}"/>
                        <button type="submit" class="text-xs text-red-600 hover:underline">Quitar</button>
                    </form>
                </div>
            </article>

            <form th:action="@{/customer/cart/clear}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="text-sm text-slate-500 hover:text-red-600">Vaciar carrito</button>
            </form>
        </div>

        <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="font-semibold text-slate-900">Resumen</h2>
            <dl class="mt-4 space-y-2 text-sm">
                <div class="flex justify-between">
                    <dt class="text-slate-500">Ítems</dt>
                    <dd th:text="${cart.totalQuantity}">0</dd>
                </div>
                <div class="flex justify-between border-t border-slate-100 pt-3 text-base font-bold">
                    <dt>Subtotal</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(cart.subtotal, 1, 2)}">S/ 0.00</dd>
                </div>
            </dl>
            <p class="mt-2 text-xs text-slate-400">Delivery y descuentos se calculan al confirmar el pedido.</p>
            <a th:href="@{/customer/checkout}"
               class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5
                      text-sm font-semibold text-white hover:bg-sky-700">
                <i class="bi bi-bag-check"></i> Continuar pedido
            </a>
        </aside>
    </div>
</section>
</body>
</html>
