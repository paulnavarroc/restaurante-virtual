<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Mis direcciones</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Mis direcciones</h1>
            <p class="mt-1 text-sm text-slate-500">Usadas en el checkout y la entrega</p>
        </div>
        <a th:href="@{/customer/addresses/new}"
           class="inline-flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
            <i class="bi bi-plus-lg"></i> Nueva dirección
        </a>
    </div>

    <div th:if="${addresses == null or #lists.isEmpty(addresses)}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-16 text-center">
        <i class="bi bi-geo-alt text-4xl text-slate-300"></i>
        <p class="mt-3 font-medium text-slate-700">No tienes direcciones guardadas</p>
        <p class="mt-1 text-sm text-slate-500">Agrega una para poder completar pedidos.</p>
        <a th:href="@{/customer/addresses/new}"
           class="mt-6 inline-flex rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Agregar dirección
        </a>
    </div>

    <div th:unless="${addresses == null or #lists.isEmpty(addresses)}"
         class="grid gap-4 sm:grid-cols-2">
        <article th:each="a : ${addresses}"
                 class="relative rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                        <h2 class="font-semibold text-slate-900"
                            th:text="${a.alias != null and !#strings.isEmpty(a.alias) ? a.alias : 'Dirección'}">Casa</h2>
                        <span th:if="${a.isPrimary}"
                              class="rounded-full bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-800">
                            Principal
                        </span>
                    </div>
                    <p class="mt-2 text-sm text-slate-600">
                        <span th:text="${a.street}">Calle</span>
                        <span th:if="${a.number != null and !#strings.isEmpty(a.number)}"
                              th:text="${' ' + a.number}"></span>
                    </p>
                    <p class="text-sm text-slate-500"
                       th:if="${a.urbanization != null and !#strings.isEmpty(a.urbanization)}"
                       th:text="${a.urbanization}"></p>
                    <p class="mt-1 text-sm text-slate-500"
                       th:if="${a.district != null}"
                       th:text="${a.district.name}">Distrito</p>
                    <p class="mt-2 text-xs text-slate-400"
                       th:if="${a.reference != null and !#strings.isEmpty(a.reference)}"
                       th:text="${'Ref: ' + a.reference}"></p>
                </div>
                <i class="bi bi-house-door text-xl text-sky-600 shrink-0"></i>
            </div>

            <!-- Acciones: solo si ya tienes endpoints en el controller -->
            <div class="mt-4 flex flex-wrap gap-2 border-t border-slate-100 pt-3 text-sm">
                <form th:if="${!a.isPrimary}"
                      th:action="@{/customer/addresses/{id}/primary(id=${a.id})}"
                      method="post"
                      class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="rounded-lg border border-slate-200 px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                        Marcar principal
                    </button>
                </form>
                
                <a th:href="@{/customer/addresses/{id}/edit(id=${a.id})}"
                   class="rounded-lg border border-slate-200 px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                    Editar
                </a>

                <form th:action="@{/customer/addresses/{id}/delete(id=${a.id})}"
                      method="post"
                      class="inline"
                      onsubmit="return confirm('¿Eliminar esta dirección?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="rounded-lg border border-red-100 px-3 py-1.5 text-red-600 hover:bg-red-50">
                        Eliminar
                    </button>
                </form>
            </div>
        </article>
    </div>
</section>
</body>
</html>
