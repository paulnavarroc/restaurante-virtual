<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Nueva dirección</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <a th:href="@{/customer/addresses}" class="text-sm font-medium text-sky-600 hover:underline">
            ← Volver a direcciones
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">Nueva dirección</h1>
        <p class="mt-1 text-sm text-slate-500">Selecciona departamento, provincia y distrito</p>
    </div>

    <form th:action="@{/customer/addresses}" th:object="${form}" method="post"
          class="max-w-xl space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
          id="addressForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm font-medium text-slate-700">Alias</label>
            <input th:field="*{alias}" type="text" placeholder="Casa, Trabajo…"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
        </div>

        <!-- Ubigeo en cascada -->
        <div class="grid gap-4 sm:grid-cols-1">
            <div>
                <label class="block text-sm font-medium text-slate-700">Departamento</label>
                <select id="departmentSelect"
                        class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100">
                    <option value="">— Selecciona —</option>
                    <option th:each="d : ${departments}"
                            th:value="${d.id}"
                            th:text="${d.name}">Lima</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Provincia</label>
                <select id="provinceSelect" disabled
                        class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100 disabled:bg-slate-50">
                    <option value="">— Selecciona departamento —</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Distrito</label>
                <!-- Este sí va al DTO -->
                <select id="districtSelect" th:field="*{districtId}" required disabled
                        class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100 disabled:bg-slate-50">
                    <option value="">— Selecciona provincia —</option>
                </select>
                <p th:if="${#fields.hasErrors('districtId')}" th:errors="*{districtId}"
                   class="mt-1 text-xs text-red-600"></p>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Urbanización / zona</label>
            <input th:field="*{urbanization}" type="text"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
        </div>

        <div class="grid gap-4 sm:grid-cols-3">
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-slate-700">Calle / avenida</label>
                <input th:field="*{street}" type="text" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
                <p th:if="${#fields.hasErrors('street')}" th:errors="*{street}"
                   class="mt-1 text-xs text-red-600"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Número</label>
                <input th:field="*{number}" type="text"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Referencia</label>
            <textarea th:field="*{reference}" rows="2"
                      class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"></textarea>
        </div>

        <div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <div class="flex flex-wrap gap-3 pt-2">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/customer/addresses}"
               class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Cancelar
            </a>
        </div>
    </form>
</section>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        (function () {
            const ctx = /*[[@{/}]]*/ '/';
            const dep = document.getElementById('departmentSelect');
            const prov = document.getElementById('provinceSelect');
            const dist = document.getElementById('districtSelect');

            function clearSelect(sel, placeholder) {
                sel.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = placeholder;
                sel.appendChild(opt);
            }

            function fillSelect(sel, items, placeholder) {
                clearSelect(sel, placeholder);
                items.forEach(function (item) {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    sel.appendChild(opt);
                });
                sel.disabled = items.length === 0;
            }

            async function loadJson(url) {
                const res = await fetch(url, {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });
                if (!res.ok) throw new Error('Error al cargar ubicación');
                return res.json();
            }

            dep.addEventListener('change', async function () {
                clearSelect(prov, '— Selecciona provincia —');
                clearSelect(dist, '— Selecciona distrito —');
                prov.disabled = true;
                dist.disabled = true;
                if (!dep.value) return;
                try {
                    const data = await loadJson(ctx + 'api/geo/provinces?departmentId=' + encodeURIComponent(dep.value));
                    fillSelect(prov, data, '— Selecciona provincia —');
                } catch (e) {
                    alert(e.message);
                }
            });

            prov.addEventListener('change', async function () {
                clearSelect(dist, '— Selecciona distrito —');
                dist.disabled = true;
                if (!prov.value) return;
                try {
                    const data = await loadJson(ctx + 'api/geo/districts?provinceId=' + encodeURIComponent(prov.value));
                    fillSelect(dist, data, '— Selecciona distrito —');
                } catch (e) {
                    alert(e.message);
                }
            });
        })();
    </script>
</th:block>
</body>
</html>
