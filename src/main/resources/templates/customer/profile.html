<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
  <title>Mi perfil</title>
</head>
<body>
<section layout:fragment="content">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Mi perfil</h1>
    <p class="mt-1 text-sm text-slate-500">Datos de tu cuenta y documento</p>
  </div>

  <div class="grid gap-6 lg:grid-cols-3">
    <!-- Resumen -->
    <aside class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-1">
      <div class="flex items-center gap-3">
        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-sky-100 text-xl font-bold text-sky-700"
             th:text="${#strings.substring(customer.user.firstName,0,1)
                              + #strings.substring(customer.user.lastName,0,1)}">
          SP
        </div>
        <div class="min-w-0">
          <p class="font-semibold text-slate-900 truncate"
             th:text="${customer.user.firstName + ' ' + customer.user.lastName}">Nombre</p>
          <p class="text-sm text-slate-500 truncate" th:text="${customer.user.email}">email</p>
        </div>
      </div>
      <dl class="mt-5 space-y-2 text-sm text-slate-600">
        <div class="flex justify-between gap-2">
          <dt>Teléfono</dt>
          <dd th:text="${customer.user.phone != null ? customer.user.phone : '—'}">—</dd>
        </div>
        <div class="flex justify-between gap-2">
          <dt>Cliente desde</dt>
          <dd th:text="${customer.createdAt != null
                        ? #temporals.format(customer.createdAt, 'dd/MM/yyyy')
                        : '—'}">—</dd>
        </div>
        <div class="flex justify-between gap-2">
          <dt>Último acceso</dt>
          <dd th:text="${customer.user.lastAccessAt != null
                        ? #temporals.format(customer.user.lastAccessAt, 'dd/MM/yyyy HH:mm')
                        : '—'}">—</dd>
        </div>
      </dl>
      <div class="mt-5 flex flex-col gap-2 text-sm">
        <a th:href="@{/customer/orders}" class="text-sky-600 hover:underline">Mis pedidos</a>
        <a th:href="@{/customer/addresses}" class="text-sky-600 hover:underline">Mis direcciones</a>
      </div>
    </aside>

    <!-- Formulario -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-2">
      <h2 class="text-lg font-semibold text-slate-900">Editar datos</h2>

      <form th:action="@{/customer/profile}" th:object="${form}" method="post" class="mt-4 space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-slate-700">Nombres</label>
            <input th:field="*{firstName}" type="text" required
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
               class="mt-1 text-xs text-red-600"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Apellidos</label>
            <input th:field="*{lastName}" type="text" required
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
               class="mt-1 text-xs text-red-600"></p>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-slate-700">Correo</label>
            <input th:field="*{email}" type="email" required
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
               class="mt-1 text-xs text-red-600"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Teléfono</label>
            <input th:field="*{phone}" type="text"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-slate-700">Tipo de documento</label>
            <select th:field="*{documentType}"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100">
              <option value="">— Opcional —</option>
              <option value="DNI">DNI</option>
              <option value="CE">Carné de extranjería</option>
              <option value="PASSPORT">Pasaporte</option>
              <option value="RUC">RUC</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Número de documento</label>
            <input th:field="*{documentNumber}" type="text"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
          </div>
        </div>

        <div class="border-t border-slate-100 pt-4">
          <h3 class="text-sm font-semibold text-slate-800">Cambiar contraseña</h3>
          <p class="mt-0.5 text-xs text-slate-500">Déjalo en blanco si no quieres cambiarla</p>
          <div class="mt-3 grid gap-4 sm:grid-cols-2">
            <div>
              <label class="block text-sm font-medium text-slate-700">Nueva contraseña</label>
              <input th:field="*{newPassword}" type="password" autocomplete="new-password"
                     class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700">Confirmar</label>
              <input th:field="*{confirmPassword}" type="password" autocomplete="new-password"
                     class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"/>
            </div>
          </div>
        </div>

        <div th:if="${error}"
             class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <button type="submit"
                class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
          Guardar cambios
        </button>
      </form>
    </div>
  </div>
</section>
</body>
</html>
