<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Confirmar pedido</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <a th:href="@{/customer/cart}" class="text-sm font-medium text-sky-600 hover:underline">← Volver al carrito</a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">Confirmar pedido</h1>
    </div>

    <div th:if="${error}" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
         th:text="${error}"></div>

    <div th:if="${addresses == null or #lists.isEmpty(addresses)}"
         class="mb-4 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        Necesitas una dirección.
        <a th:href="@{/customer/addresses/new}" class="font-semibold underline">Agregar</a>
    </div>

    <form th:action="@{/customer/checkout}" th:object="${form}" method="post"
          class="grid gap-6 lg:grid-cols-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-6 lg:col-span-2">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold">1. Dirección</h2>
                <div class="mt-3 space-y-2">
                    <label th:each="a : ${addresses}"
                           class="flex cursor-pointer gap-3 rounded-xl border p-3 has-[:checked]:border-sky-500 has-[:checked]:bg-sky-50">
                        <input type="radio" th:field="*{addressId}" th:value="${a.id}" class="mt-1" required/>
                        <span class="text-sm">
                            <span class="font-medium" th:text="${a.alias} ?: 'Dirección'">Casa</span>
                            <span class="block text-slate-600" th:text="${a.street}"></span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold">2. Pago</h2>
                <div class="mt-3 space-y-2">
                    <label th:each="m : ${paymentMethods}"
                           class="flex cursor-pointer gap-3 rounded-xl border p-3 has-[:checked]:border-sky-500 has-[:checked]:bg-sky-50">
                        <input type="radio" th:field="*{paymentMethodId}" th:value="${m.id}" class="mt-1" required/>
                        <span class="text-sm font-medium" th:text="${m.name}">Efectivo</span>
                    </label>
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold">3. Notas (opcional)</h2>
                <textarea th:field="*{notes}" rows="2"
                          class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold">4. Cupón (opcional)</h2>
                <div class="mt-2 flex flex-wrap gap-2">
                    <input th:field="*{couponCode}" type="text"
                           class="rounded-xl border border-slate-200 px-3 py-2 text-sm uppercase"
                           placeholder="CÓDIGO"/>
                    <button type="submit" formaction="/customer/checkout/preview"
                            class="rounded-xl border border-slate-200 px-4 py-2 text-sm hover:bg-slate-50">
                        Aplicar cupón
                    </button>
                </div>
                <p class="mt-2 text-xs text-slate-500"
                   th:if="${preview != null and preview.couponMessage() != null}"
                   th:text="${preview.couponMessage()}"></p>
            </div>
        </div>

        <aside class="h-fit lg:sticky lg:top-24">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="font-semibold text-slate-900">Resumen</h2>

                <!-- Ítems: preview o cart -->
                <ul class="mt-4 space-y-2 text-sm"
                    th:if="${preview != null and preview.items() != null and !preview.items().isEmpty()}">
                    <li th:each="item : ${preview.items()}" class="flex justify-between gap-2">
                        <span>
                            <span th:text="${item.quantity()}">1</span>×
                            <span th:text="${item.productName()}">Producto</span>
                        </span>
                        <span th:text="${'S/ ' + #numbers.formatDecimal(item.lineTotal(), 1, 2)}"></span>
                    </li>
                </ul>
                <ul class="mt-4 space-y-2 text-sm"
                    th:if="${preview == null or preview.items() == null or preview.items().isEmpty()}"
                    th:with="cartItems=${cart != null ? cart.items() : null}">
                    <li th:each="item : ${cartItems}" class="flex justify-between gap-2">
                        <span>
                            <span th:text="${item.quantity()}">1</span>×
                            <span th:text="${item.productName()}">Producto</span>
                        </span>
                        <span th:text="${'S/ ' + #numbers.formatDecimal(item.lineTotal(), 1, 2)}"></span>
                    </li>
                    <li th:if="${cartItems == null or cartItems.isEmpty()}" class="text-slate-500">
                        Carrito vacío
                    </li>
                </ul>

                <dl class="mt-4 space-y-2 border-t border-slate-100 pt-3 text-sm" th:if="${preview != null}">
                    <div class="flex justify-between">
                        <dt class="text-slate-500">Subtotal</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.subtotal(), 1, 2)}"></dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-slate-500">Delivery</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.deliveryFee(), 1, 2)}"></dd>
                    </div>
                    <div th:if="${preview.couponDiscount() != null and preview.couponDiscount().signum() > 0}"
                         class="flex justify-between text-emerald-700">
                        <dt>Cupón</dt>
                        <dd th:text="${'− S/ ' + #numbers.formatDecimal(preview.couponDiscount(), 1, 2)}"></dd>
                    </div>
                    <div class="flex justify-between border-t pt-3 text-base font-bold">
                        <dt>Total</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.total(), 1, 2)}"></dd>
                    </div>
                </dl>

                <p th:if="${preview != null and preview.errorMessage() != null}"
                   class="mt-3 text-xs text-amber-800" th:text="${preview.errorMessage()}"></p>

                <!-- Siempre visible -->
                <button type="submit"
                        class="mt-6 w-full rounded-xl bg-sky-600 px-4 py-3 text-sm font-semibold text-white
                               hover:bg-sky-700 disabled:bg-slate-300 disabled:cursor-not-allowed"
                        th:disabled="${addresses == null or #lists.isEmpty(addresses)}">
                    Confirmar pedido
                </button>
            </div>
        </aside>
    </form>
</section>
</body>
</html>
