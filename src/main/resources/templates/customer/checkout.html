<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Confirmar pedido</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Confirmar pedido</h1>
        <p class="text-sm text-slate-500">Elige dirección y confirma</p>
    </div>

    <div th:if="${#lists.isEmpty(addresses)}"
         class="mb-6 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        Necesitas al menos una dirección.
        <a th:href="@{/customer/addresses/new}" class="font-semibold underline">Agregar dirección</a>
    </div>

    <form th:action="@{/customer/checkout}" th:object="${form}" method="post"
          class="grid gap-6 lg:grid-cols-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-6 lg:col-span-2">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold text-slate-900">Dirección de entrega</h2>
                <div class="mt-3 space-y-2">
                    <label th:each="a : ${addresses}"
                           class="flex cursor-pointer gap-3 rounded-xl border border-slate-200 p-3 hover:border-sky-300 has-[:checked]:border-sky-500 has-[:checked]:bg-sky-50">
                        <input type="radio" th:field="*{addressId}" th:value="${a.id}" class="mt-1">
                        <span class="text-sm">
                            <span class="font-medium text-slate-900" th:text="${a.alias} ?: 'Dirección'">Alias</span>
                            <span class="block text-slate-600"
                                  th:text="${a.street + (a.number != null ? ' ' + a.number : '')}">Calle</span>
                            <span class="block text-xs text-slate-400"
                                  th:if="${a.district != null}" th:text="${a.district.name}">Distrito</span>
                        </span>
                    </label>
                </div>
                <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('addressId')}" th:errors="*{addressId}"></p>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold text-slate-900">Método de pago</h2>
                <div class="mt-3 space-y-2">
                    <label th:each="m : ${paymentMethods}" class="flex cursor-pointer gap-3 rounded-xl border border-slate-200 p-3 hover:border-sky-300 has-[:checked]:border-sky-500 has-[:checked]:bg-sky-50">
                        <input type="radio" th:field="*{paymentMethodId}" th:value="${m.id}" class="mt-1" required>
                        <span class="text-sm">
                            <span class="font-medium text-slate-900" th:text="${m.name}">Efectivo</span>
                            <span class="block text-xs text-slate-400" th:text="${m.isOnline} ? 'Pago digital' : 'Pago al recibir / en tienda'"></span>
                        </span>
                    </label>
                </div>
                <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('paymentMethodId')}" th:errors="*{paymentMethodId}"></p>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <label class="block text-sm font-semibold text-slate-900">Notas</label>
                <textarea th:field="*{notes}" rows="3"
                          class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm
                                 focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                          placeholder="Referencias, sin ají, etc."></textarea>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <label class="block text-sm font-semibold text-slate-900">Cupón (opcional)</label>
                <input type="text" th:field="*{couponCode}"
                       class="mt-2 w-full max-w-xs rounded-xl border border-slate-300 px-3 py-2 text-sm uppercase
                              focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                       placeholder="CODIGO">
            </div>
        </div>

        <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="font-semibold text-slate-900">Resumen</h2>

            <div th:if="${preview != null and preview.errorMessage() != null}"
                 class="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-900"
                 th:text="${preview.errorMessage()}"></div>

            <ul class="mt-4 space-y-2 text-sm" th:if="${preview != null}">
                <li th:each="item : ${preview.items()}" class="flex justify-between gap-2">
            <span class="text-slate-600">
                <span th:text="${item.quantity}">1</span>×
                <span th:text="${item.productName}">Producto</span>
            </span>
                    <span th:text="${'S/ ' + #numbers.formatDecimal(item.lineTotal, 1, 2)}"></span>
                </li>
            </ul>

            <dl class="mt-4 space-y-2 border-t border-slate-100 pt-3 text-sm" th:if="${preview != null}">
                <div class="flex justify-between">
                    <dt class="text-slate-500">Subtotal</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.subtotal(), 1, 2)}"></dd>
                </div>
                <div class="flex justify-between">
                    <dt class="text-slate-500">Delivery</dt>
                    <dd th:text="${preview.addressSelected() /* o addressId */}
                ? ${'S/ ' + #numbers.formatDecimal(preview.deliveryFee(), 1, 2)}
                : 'Elige dirección'"></dd>
                </div>
                <!-- más simple: -->
                <div class="flex justify-between">
                    <dt class="text-slate-500">Delivery</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.deliveryFee(), 1, 2)}"></dd>
                </div>

                <div th:if="${preview.promotionDiscount().compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                     class="flex justify-between text-emerald-700">
                    <dt>Promociones</dt>
                    <dd th:text="${'− S/ ' + #numbers.formatDecimal(preview.promotionDiscount(), 1, 2)}"></dd>
                </div>
                <ul th:if="${preview.promotionLabels() != null and !#lists.isEmpty(preview.promotionLabels())}"
                    class="text-xs text-emerald-700">
                    <li th:each="lb : ${preview.promotionLabels()}" th:text="${lb}"></li>
                </ul>

                <div th:if="${preview.couponDiscount().compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                     class="flex justify-between text-emerald-700">
                    <dt>Cupón</dt>
                    <dd th:text="${'− S/ ' + #numbers.formatDecimal(preview.couponDiscount(), 1, 2)}"></dd>
                </div>
                <p th:if="${preview.couponMessage() != null}" class="text-xs text-slate-500"
                   th:text="${preview.couponMessage()}"></p>

                <div class="flex justify-between border-t border-slate-100 pt-3 text-base font-bold">
                    <dt>Total</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(preview.total(), 1, 2)}"></dd>
                </div>
            </dl>

            <form th:action="@{/customer/checkout}" th:object="${form}" method="post" class="mt-6 space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="flex w-full items-center justify-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5
                       text-sm font-semibold text-white hover:bg-sky-700"
                        th:disabled="${preview == null or !preview.valid() or #lists.isEmpty(addresses)}">
                    <i class="bi bi-check2-circle"></i> Confirmar pedido
                </button>
            </form>
        </aside>

    </form>
</section>
</body>
</html>
