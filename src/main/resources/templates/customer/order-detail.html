<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Detalle pedido</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="text-2xl font-bold">Pedido #<span th:text="${order.id}"></span></h1>
    <p class="text-sm text-slate-500"
       th:text="${order.orderStatus.name + ' · ' + #temporals.format(order.orderedAt, 'dd/MM/yyyy HH:mm')}"></p>
    <ul class="mt-6 space-y-2">
        <li th:each="i : ${order.items}" class="flex justify-between rounded-xl border bg-white px-4 py-3 text-sm">
            <span th:text="${i.quantity + ' × ' + i.productNameSnapshot}"></span>
            <span th:text="${'S/ ' + #numbers.formatDecimal(i.lineTotal, 1, 2)}"></span>
        </li>
    </ul>
    <dl class="mt-4 space-y-1 text-sm">
        <div class="flex justify-between"><dt>Subtotal</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(order.subtotal, 1, 2)}"></dd></div>
        <div class="flex justify-between"><dt>Delivery</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(order.deliveryFee, 1, 2)}"></dd></div>
        <div class="flex justify-between"><dt>Descuento</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(order.discount, 1, 2)}"></dd></div>
        <div class="flex justify-between font-bold text-base"><dt>Total</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(order.total, 1, 2)}"></dd></div>
    </dl>
    <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5" th:if="${payments != null and !#lists.isEmpty(payments)}">
        <h2 class="font-semibold text-slate-900">Pago</h2>
        <ul class="mt-3 space-y-2 text-sm">
            <li th:each="pay : ${payments}" class="flex justify-between gap-2">
            <span>
                <span th:text="${pay.paymentMethod.name}">Método</span>
                <span class="ml-2 rounded-full bg-slate-100 px-2 py-0.5 text-xs" th:text="${pay.status}"></span>
            </span>
                <span th:text="${'S/ ' + #numbers.formatDecimal(pay.amount, 1, 2)}"></span>
            </li>
        </ul>
    </div>
</section>
</body>
</html>
