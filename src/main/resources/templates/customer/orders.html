<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Mis pedidos</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Mis pedidos</h1>
            <p class="mt-1 text-sm text-slate-500">Historial y seguimiento de tus órdenes</p>
        </div>
        <a th:href="@{/menu}"
           class="inline-flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
            <i class="bi bi-egg-fried"></i> Ver menú
        </a>
    </div>

    <div th:if="${orders == null or #lists.isEmpty(orders)}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-16 text-center">
        <i class="bi bi-bag text-4xl text-slate-300"></i>
        <p class="mt-3 font-medium text-slate-700">Aún no tienes pedidos</p>
        <p class="mt-1 text-sm text-slate-500">Cuando confirmes uno, aparecerá aquí.</p>
        <a th:href="@{/menu}" class="mt-6 inline-flex rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Ir al menú
        </a>
    </div>

    <div th:unless="${orders == null or #lists.isEmpty(orders)}"
         class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
                <thead class="border-b border-slate-100 bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-4 py-3 font-medium">Pedido</th>
                    <th class="px-4 py-3 font-medium">Fecha</th>
                    <th class="px-4 py-3 font-medium">Estado</th>
                    <th class="px-4 py-3 font-medium text-right">Total</th>
                    <th class="px-4 py-3 font-medium"></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="o : ${orders}" class="hover:bg-slate-50/80">
                    <td class="px-4 py-3">
                        <span class="font-semibold text-slate-900">#</span>
                        <span class="font-semibold text-slate-900" th:text="${o.id}">1</span>
                    </td>
                    <td class="px-4 py-3 text-slate-600 whitespace-nowrap"
                        th:text="${o.orderedAt != null}
                            ? ${#temporals.format(o.orderedAt, 'dd/MM/yyyy HH:mm')}
                            : '—'">—</td>
                    <td class="px-4 py-3">
                        <span class="inline-flex rounded-full bg-sky-50 px-2.5 py-0.5 text-xs font-semibold text-sky-800"
                              th:text="${o.orderStatus != null ? o.orderStatus.name : '—'}">Pendiente</span>
                    </td>
                    <td class="px-4 py-3 text-right font-medium text-slate-900 whitespace-nowrap"
                        th:text="${o.total != null}
                            ? ${'S/ ' + #numbers.formatDecimal(o.total, 1, 2)}
                            : '—'">S/ 0.00</td>
                    <td class="px-4 py-3 text-right">
                        <a th:href="@{/customer/orders/{id}(id=${o.id})}"
                           class="inline-flex items-center gap-1 text-sm font-medium text-sky-600 hover:text-sky-800">
                            Ver <i class="bi bi-chevron-right text-xs"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
