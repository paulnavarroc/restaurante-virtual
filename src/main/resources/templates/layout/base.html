<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE – $LAYOUT_TITLE">Sabores Perú</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <th:block layout:fragment="head"></th:block>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-900 antialiased">

<!-- Navbar -->
<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4">
        <a th:href="@{/menu}" class="flex items-center gap-2 text-lg font-bold text-sky-700">
            <i class="bi bi-fire text-sky-600"></i>
            Sabores Perú
        </a>

        <nav class="flex flex-wrap items-center gap-2 text-sm text-slate-600 sm:gap-3">
            <a th:href="@{/menu}" class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Menú</a>

            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente/pedidos}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Mis pedidos</a>
            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente/direcciones}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Direcciones</a>
            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente/perfil}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Perfil</a>

            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente/carrito}"
               class="relative rounded-lg p-2 hover:bg-sky-50">
                <i class="bi bi-cart3 text-lg"></i>
                <span th:if="${carritoCount != null and carritoCount > 0}"
                      th:text="${carritoCount}"
                      class="absolute -right-1 -top-1 flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-sky-600 px-1 text-[10px] font-bold text-white">0</span>
            </a>

            <a sec:authorize="hasRole('CHEF')" th:href="@{/cocina/pedidos}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Cocina</a>
            <a sec:authorize="hasRole('REPARTIDOR')" th:href="@{/repartidor/entregas}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Entregas</a>
            <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/admin/dashboard}"
               class="rounded-lg px-2 py-1.5 hover:bg-sky-50 hover:text-sky-700">Admin</a>

            <span sec:authorize="isAuthenticated()" class="hidden text-slate-500 sm:inline"
                  sec:authentication="name"></span>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit" class="btn-secondary !py-1.5 !text-xs">Salir</button>
            </form>

            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn-secondary !py-1.5 !text-xs">Entrar</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/registro}" class="btn-primary !py-1.5 !text-xs">Registrarse</a>
        </nav>
    </div>
</header>

<!-- Flash messages -->
<div class="mx-auto max-w-6xl px-4 pt-4">
    <div th:if="${mensaje}"
         class="mb-4 rounded-xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
         th:text="${mensaje}"></div>
    <div th:if="${error}"
         class="mb-4 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>
</div>

<!-- Contenido de cada vista -->
<main class="flex-1" layout:fragment="content">
    <!-- las páginas hijas insertan aquí -->
</main>

<footer class="mt-12 border-t border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col justify-between gap-4 px-4 py-8 text-sm text-slate-500 sm:flex-row">
        <div>
            <p class="font-semibold text-slate-800">Sabores Perú</p>
            <p>Comida regional de Costa, Sierra y Selva a domicilio.</p>
        </div>
        <div class="flex gap-4">
            <a th:href="@{/menu}" class="hover:text-sky-700">Menú</a>
            <a th:href="@{/login}" class="hover:text-sky-700">Iniciar sesión</a>
        </div>
    </div>
</footer>

</body>
</html>
