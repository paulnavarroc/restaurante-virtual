<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · Admin | Sabores Perú">Admin · Sabores Perú</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<div class="flex min-h-screen">

    <aside class="hidden w-64 shrink-0 flex-col border-r border-slate-200 bg-white lg:flex">
        <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-5">
            <i class="bi bi-fire text-xl text-sky-600"></i>
            <span class="font-bold text-slate-900">Sabores Perú</span>
        </div>

        <nav class="flex-1 space-y-1 overflow-y-auto p-3 text-sm">
            <th:block th:each="item, iter : ${adminMenu}">
                <!-- Separador de grupo -->
                <p th:if="${iter.index == 0 or item.menuGroup != adminMenu[iter.index - 1].menuGroup}"
                   class="mb-1 mt-4 px-3 text-[11px] font-semibold uppercase tracking-wide text-slate-400"
                   th:text="${item.menuGroup}">Grupo</p>

                <a th:href="@{${item.route}}"
                   th:classappend="${#strings.startsWith(currentUri, item.route)}
                       ? 'bg-sky-50 text-sky-700 font-semibold'
                       : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
                   class="flex items-center gap-2.5 rounded-lg px-3 py-2 transition">
                    <i th:class="'bi ' + ${item.icon}"></i>
                    <span th:text="${item.label}">Ítem</span>
                </a>
            </th:block>
        </nav>

        <div class="border-t border-slate-200 p-3 text-xs text-slate-500">
            <div class="truncate font-medium text-slate-700" sec:authentication="name">email</div>
        </div>
    </aside>

    <!-- Main -->
    <div class="flex min-w-0 flex-1 flex-col">
        <!-- Top bar -->
        <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 lg:px-6">
            <div class="flex items-center gap-3">
                <button type="button" id="adminSidebarToggle"
                        class="inline-flex rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden"
                        aria-label="Menú">
                    <i class="bi bi-list text-xl"></i>
                </button>
                <h1 class="text-base font-semibold text-slate-900 lg:text-lg"
                    layout:fragment="pageTitle">Panel</h1>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <a th:href="@{/menu}" class="hidden rounded-lg px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50 sm:inline-flex items-center gap-1">
                    <i class="bi bi-shop"></i> Ver tienda
                </a>

                <div class="hidden items-center gap-2 sm:flex">
                    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-sky-100 text-xs font-bold text-sky-700"
                         th:text="${session.INITIALS != null ? session.INITIALS : '?'}">
                        SP
                    </div>
                    <span class="max-w-[140px] truncate text-sm font-medium text-slate-700"
                          th:text="${session.DISPLAY_NAME != null ? session.DISPLAY_NAME : #authentication.name}">
                        Usuario
                    </span>
                </div>
                <!-- móvil: solo avatar -->
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-sky-100 text-xs font-bold text-sky-700 sm:hidden"
                     th:text="${session.INITIALS != null ? session.INITIALS : '?'}">
                    SP
                </div>

                <form th:action="@{/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="inline-flex items-center gap-1 rounded-lg border border-slate-200 px-3 py-1.5 text-sm
                                   text-slate-700 hover:bg-slate-50">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="hidden sm:inline">Salir</span>
                    </button>
                </form>
            </div>
        </header>

        <!-- Flash -->
        <div class="px-4 pt-4 lg:px-6" th:if="${mensaje != null or error != null}">
            <div th:if="${mensaje}" class="mb-2 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
                 th:text="${mensaje}"></div>
            <div th:if="${error}" class="mb-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
                 th:text="${error}"></div>
        </div>

        <main class="flex-1 p-4 lg:p-6" layout:fragment="content">
            <!-- contenido de cada vista admin -->
        </main>
    </div>
</div>

<!-- Drawer móvil -->
<div id="adminDrawer" class="fixed inset-0 z-40 hidden lg:hidden" aria-hidden="true">
    <div id="adminDrawerBackdrop" class="absolute inset-0 bg-slate-900/40"></div>
    <aside class="absolute inset-y-0 left-0 flex w-72 max-w-[85%] flex-col bg-white shadow-xl">
        <div class="flex h-16 items-center justify-between border-b border-slate-200 px-4">
            <span class="font-bold text-slate-900">Menú</span>
            <button type="button" id="adminDrawerClose" class="rounded-lg p-2 hover:bg-slate-100">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <nav class="flex-1 space-y-1 overflow-y-auto p-3 text-sm">
            <a th:each="item : ${adminMenu}"
               th:href="@{${item.route}}"
               th:classappend="${#strings.startsWith(currentUri, item.route)}
                   ? 'bg-sky-50 text-sky-700 font-semibold' : 'text-slate-600'"
               class="flex items-center gap-2.5 rounded-lg px-3 py-2">
                <i th:class="'bi ' + ${item.icon}"></i>
                <span th:text="${item.label}">Ítem</span>
            </a>
        </nav>
    </aside>
</div>

<script>
    (function () {
        const drawer = document.getElementById('adminDrawer');
        const openBtn = document.getElementById('adminSidebarToggle');
        const closeBtn = document.getElementById('adminDrawerClose');
        const backdrop = document.getElementById('adminDrawerBackdrop');
        if (!drawer || !openBtn) return;
        function open() { drawer.classList.remove('hidden'); document.body.classList.add('overflow-hidden'); }
        function close() { drawer.classList.add('hidden'); document.body.classList.remove('overflow-hidden'); }
        openBtn.addEventListener('click', open);
        closeBtn && closeBtn.addEventListener('click', close);
        backdrop && backdrop.addEventListener('click', close);
    })();
</script>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
