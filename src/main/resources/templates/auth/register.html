<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Crear cuenta</title>
</head>
<body>
<section layout:fragment="content" class="mx-auto max-w-lg px-4 py-12">
    <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900">Crear cuenta</h1>
        <p class="mt-1 text-sm text-slate-500">Regístrate para hacer pedidos</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <div th:if="${error}" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${form}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Nombres</label>
                    <input type="text" th:field="*{firstName}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                    <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Apellidos</label>
                    <input type="text" th:field="*{lastName}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                    <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                </div>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Correo</label>
                <input type="email" th:field="*{email}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Contraseña</label>
                <input type="password" th:field="*{password}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Teléfono</label>
                    <input type="text" th:field="*{phone}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">DNI (opcional)</label>
                    <input type="text" th:field="*{documentNumber}" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                </div>
            </div>

            <button type="submit" class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                <i class="bi bi-person-plus"></i>
                Crear cuenta
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}" class="font-semibold text-sky-600 hover:text-sky-700">Inicia sesión</a>
        </p>
    </div>
</section>
</body>
</html>
