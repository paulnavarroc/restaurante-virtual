<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Iniciar sesión</title>
</head>
<body>
<section layout:fragment="content" class="mx-auto max-w-md px-4 py-12">
    <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900">Iniciar sesión</h1>
        <p class="mt-1 text-sm text-slate-500">Accede a tu cuenta de Sabores Perú</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <div th:if="${error}" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${error}">Error</div>
        <div th:if="${mensaje}" class="mb-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" th:text="${mensaje}">OK</div>
        <div th:if="${param.securityUpdated}" class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-900">La configuración de seguridad cambió. Vuelve a iniciar sesión.</div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label for="username" class="mb-1.5 block text-sm font-medium text-slate-700">Correo</label>
                <div class="relative">
                    <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="username" name="username" required autofocus autocomplete="username" class="w-full rounded-xl border border-slate-300 py-2.5 pl-10 pr-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" placeholder="tu@correo.com">
                </div>
            </div>

            <div>
                <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Contraseña</label>
                <div class="relative">
                    <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-300 py-2.5 pl-10 pr-3 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700 focus:ring-2 focus:ring-sky-300">
                <i class="bi bi-box-arrow-in-right"></i>
                Entrar
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
            ¿No tienes cuenta?
            <a th:href="@{/register}" class="font-semibold text-sky-600 hover:text-sky-700">Regístrate</a>
        </p>
    </div>
</section>
</body>
</html>
