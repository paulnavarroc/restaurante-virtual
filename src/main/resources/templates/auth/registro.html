<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Crear cuenta</title>
</head>
<body>

<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <div class="mx-auto w-full max-w-xl">

            <!-- Cabecera -->
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-sky-50 text-sky-600">
                    <i class="bi bi-person-plus text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Crear cuenta</h1>
                <p class="mt-1 text-sm text-slate-500">
                    Regístrate para pedir comida regional a domicilio
                </p>
            </div>

            <!-- Card -->
            <div class="card p-6 sm:p-8">

                <div th:if="${error}"
                     class="mb-4 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-800"
                     th:text="${error}">
                </div>

                <form th:action="@{/registro}"
                      th:object="${usuario}"
                      method="post"
                      class="space-y-4">

                    <div class="grid gap-4 sm:grid-cols-2">
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nombre *</label>
                            <input type="text" th:field="*{nombre}" required class="input" placeholder="Ana">
                            <p th:if="${#fields.hasErrors('nombre')}"
                               th:errors="*{nombre}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Apellido *</label>
                            <input type="text" th:field="*{apellido}" required class="input" placeholder="Pérez">
                            <p th:if="${#fields.hasErrors('apellido')}"
                               th:errors="*{apellido}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>
                    </div>

                    <div>
                        <label class="mb-1.5 block text-sm font-medium text-slate-700">Correo *</label>
                        <div class="relative">
                            <i class="bi bi-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="email" th:field="*{correo}" required class="input pl-10"
                                   placeholder="tu@email.com">
                        </div>
                        <p th:if="${#fields.hasErrors('correo')}"
                           th:errors="*{correo}"
                           class="mt-1 text-xs text-red-600"></p>
                    </div>

                    <div class="grid gap-4 sm:grid-cols-2">
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Contraseña *</label>
                            <div class="relative">
                                <i class="bi bi-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="password" th:field="*{password}" required minlength="6"
                                       class="input pl-10" placeholder="Mín. 6 caracteres">
                            </div>
                            <p th:if="${#fields.hasErrors('password')}"
                               th:errors="*{password}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Confirmar *</label>
                            <div class="relative">
                                <i class="bi bi-lock-fill absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="password" th:field="*{confirmPassword}" required
                                       class="input pl-10" placeholder="Repite la contraseña">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="mb-1.5 block text-sm font-medium text-slate-700">Teléfono</label>
                        <div class="relative">
                            <i class="bi bi-telephone absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" th:field="*{telefono}" class="input pl-10"
                                   placeholder="999 999 999">
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4">
                        <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-400">
                            Dirección inicial (opcional)
                        </p>
                        <div class="space-y-4">
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-slate-700">Dirección</label>
                                <input type="text" th:field="*{direccionCompleta}" class="input"
                                       placeholder="Av. Larco 123, Miraflores">
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-slate-700">Distrito</label>
                                <input type="text" th:field="*{distrito}" class="input" placeholder="Miraflores">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full">
                        <i class="bi bi-check2-circle"></i>
                        Crear mi cuenta
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-slate-500">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}" class="font-semibold text-sky-700 hover:text-sky-800">
                        Inicia sesión
                    </a>
                </p>
            </div>

            <p class="mt-6 text-center text-xs text-slate-400">
                <a th:href="@{/menu}" class="hover:text-sky-700">← Volver al menú</a>
            </p>
        </div>
    </section>
</main>

</body>
</html>
