<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Entregas</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Entregas</h1>
        <p class="text-sm text-slate-500" th:if="${courier != null}">
        <span th:if="${courier.branch != null}">
            Sede: <span th:text="${courier.branch.name}">—</span>
            <span class="text-slate-400"> · </span>
        </span>
            Estado: <span th:text="${courier.status}">—</span>
        </p>
    </div>

    <!-- Mis entregas activas -->
    <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">En curso</h2>
    <div th:if="${#lists.isEmpty(mine)}"
         class="mb-8 rounded-xl border border-dashed border-slate-200 bg-white p-8 text-center text-sm text-slate-500">
        No tienes entregas asignadas.
    </div>
    <div class="mb-10 space-y-4">
        <article th:each="d : ${mine}"
                 class="rounded-2xl border border-sky-200 bg-white p-5 shadow-sm">
            <div class="flex flex-wrap justify-between gap-2">
                <div>
                    <p class="font-bold text-slate-900">Pedido #<span th:text="${d.order.id}"></span></p>
                    <span class="text-xs font-semibold text-sky-700" th:text="${d.status}"></span>
                </div>
                <p class="font-bold" th:text="${'S/ ' + #numbers.formatDecimal(d.order.total, 1, 2)}"></p>
            </div>
            <p class="mt-2 text-sm text-slate-600"
               th:if="${d.order.address != null}"
               th:text="${d.order.address.street + (d.order.address.number != null ? ' ' + d.order.address.number : '')}"></p>
            <p class="text-xs text-slate-400"
               th:if="${d.order.address != null and d.order.address.district != null}"
               th:text="${d.order.address.district.name}"></p>
            <p class="mt-1 text-xs text-amber-700" th:if="${d.order.notes != null}"
               th:text="${'Nota: ' + d.order.notes}"></p>

            <div class="mt-4 flex flex-wrap gap-2">
                <form th:if="${d.status == 'ASSIGNED'}"
                      th:action="@{/courier/deliveries/{id}/start(id=${d.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="rounded-lg bg-sky-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-sky-700">
                        Salir a ruta
                    </button>
                </form>
                <form th:if="${d.status == 'ON_ROUTE' or d.status == 'ASSIGNED'}"
                      th:action="@{/courier/deliveries/{id}/delivered(id=${d.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-emerald-700">
                        Entregado
                    </button>
                </form>
                <form th:action="@{/courier/deliveries/{id}/failed(id=${d.id})}" method="post" class="flex gap-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="text" name="notes" placeholder="Motivo" class="rounded-lg border px-2 text-sm">
                    <button class="rounded-lg border border-red-200 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50">
                        Fallida
                    </button>
                </form>
            </div>
        </article>
    </div>

    <!-- Disponibles en la sede -->
    <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Disponibles en sede</h2>
    <div th:if="${#lists.isEmpty(pending)}"
         class="rounded-xl border border-dashed border-slate-200 bg-white p-8 text-center text-sm text-slate-500">
        No hay pedidos listos pendientes de reparto.
    </div>
    <div class="space-y-4">
        <article th:each="d : ${pending}"
                 class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <p class="font-bold text-slate-900">Pedido #<span th:text="${d.order.id}"></span></p>
                    <p class="text-sm text-slate-600"
                       th:if="${d.order.address != null}"
                       th:text="${d.order.address.street}"></p>
                </div>
                <form th:action="@{/courier/deliveries/{id}/claim(id=${d.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-600">
                        Tomar entrega
                    </button>
                </form>
            </div>
        </article>
    </div>
</section>
</body>
</html>
