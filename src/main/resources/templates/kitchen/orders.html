<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Cocina</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Cocina</h1>
        <p class="text-sm text-slate-500"
           th:text="${branch != null ? 'Sede: ' + branch.name : ''}">Sede</p>
    </div>

    <div th:if="${#lists.isEmpty(orders)}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white p-12 text-center text-slate-500">
        No hay pedidos activos.
    </div>

    <div class="space-y-4">
        <article th:each="o : ${orders}"
                 class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
                <div>
                    <h2 class="font-bold text-slate-900">
                        Pedido #<span th:text="${o.id}"></span>
                    </h2>
                    <p class="text-sm text-slate-500"
                       th:text="${#temporals.format(o.orderedAt, 'dd/MM/yyyy HH:mm')}"></p>
                    <span class="mt-1 inline-flex rounded-full bg-sky-50 px-2.5 py-0.5 text-xs font-semibold text-sky-700"
                          th:text="${o.orderStatus.name}">Estado</span>
                </div>
                <p class="text-lg font-bold"
                   th:text="${'S/ ' + #numbers.formatDecimal(o.total, 1, 2)}"></p>
            </div>

            <ul class="mt-3 space-y-1 border-t border-slate-100 pt-3 text-sm text-slate-700">
                <li th:each="i : ${o.items}"
                    th:text="${i.quantity + ' × ' + i.productNameSnapshot}"></li>
            </ul>
            <p th:if="${o.notes != null}" class="mt-2 text-xs text-amber-700"
               th:text="${'Nota: ' + o.notes}"></p>

            <div class="mt-4 flex flex-wrap gap-2">
                <form th:if="${o.orderStatus.code == 'PENDING' or o.orderStatus.code == 'CONFIRMED'}"
                      th:action="@{/kitchen/orders/{id}/status(id=${o.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="status" value="IN_PREPARATION"/>
                    <button class="rounded-lg bg-amber-500 px-3 py-1.5 text-sm font-semibold text-white hover:bg-amber-600">
                        Preparar
                    </button>
                </form>
                <form th:if="${o.orderStatus.code == 'IN_PREPARATION'}"
                      th:action="@{/kitchen/orders/{id}/status(id=${o.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="status" value="READY"/>
                    <button class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-emerald-700">
                        Listo
                    </button>
                </form>
            </div>
        </article>
    </div>
</section>
</body>
</html>
