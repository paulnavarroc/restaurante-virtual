<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Menú</title>
</head>
<body>
<section layout:fragment="content">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Menú</h1>
        <p class="mt-1 text-sm text-slate-500">Platos de nuestra carta. Inicia sesión para ordenar.</p>
    </div>

    <form id="menu-filters"
          class="mb-8 flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:flex-row sm:flex-wrap sm:items-end"
          onsubmit="return false;">
        <div class="min-w-[140px] flex-1">
            <label class="mb-1 block text-xs font-medium text-slate-500">Buscar</label>
            <div class="relative">
                <i class="bi bi-search pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="search" name="q" id="filter-q" th:value="${q}"
                       placeholder="Ceviche, lomo..."
                       class="w-full rounded-xl border border-slate-300 py-2 pl-9 pr-3 text-sm
                              focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
            </div>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Categoría</label>
            <select name="categoryId" id="filter-category" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <option value="">Todas</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${categoryId != null and categoryId == c.id}"></option>
            </select>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Región</label>
            <select name="regionId" id="filter-region" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <option value="">Todas</option>
                <option th:each="r : ${regions}"
                        th:value="${r.id}"
                        th:text="${r.name}"
                        th:selected="${regionId != null and regionId == r.id}"></option>
            </select>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Sede</label>
            <select name="branchId" id="filter-branch" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                <option value="">Principal</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"
                        th:selected="${branchId != null and branchId == b.id}"></option>
            </select>
        </div>
        <button type="button" id="filter-apply" class="rounded-xl bg-sky-600 px-5 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Filtrar
        </button>
        <button type="button" id="filter-clear" class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:text-sky-600">
            Limpiar
        </button>
    </form>

    <p th:if="${currentShiftLabel != null}" class="mb-4 text-sm text-slate-500">
        Turno actual: <span class="font-semibold text-slate-700" th:text="${currentShiftLabel}"></span>
    </p>

    <div id="menu-status" class="mb-4 hidden text-sm text-slate-500"></div>
    <div id="product-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="menu-page" class="hidden" th:attr="data-authenticated=${#authentication != null and #authentication.authenticated and #authentication.name != 'anonymousUser'}"></div>
</section>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/menu.js}"></script>
</th:block>
</body>
</html>
