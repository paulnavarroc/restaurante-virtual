<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Menú</title>
</head>
<body>
<section layout:fragment="content">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Menú</h1>
        <p class="mt-1 text-sm text-slate-500">Platos de nuestra carta. Inicia sesión para ordenar.</p>
    </div>

    <!-- Filtros -->
    <form th:action="@{/menu}" method="get"
          class="mb-8 flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:flex-row sm:flex-wrap sm:items-end">
        <div class="min-w-[140px] flex-1">
            <label class="mb-1 block text-xs font-medium text-slate-500">Buscar</label>
            <div class="relative">
                <i class="bi bi-search pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="search" name="q" th:value="${q}"
                       placeholder="Ceviche, lomo..."
                       class="w-full rounded-xl border border-slate-300 py-2 pl-9 pr-3 text-sm
                              focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
            </div>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Categoría</label>
            <select name="categoryId"
                    class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <option value="">Todas</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${categoryId != null and categoryId == c.id}"></option>
            </select>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Región</label>
            <select name="regionId"
                    class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                <option value="">Todas</option>
                <option th:each="r : ${regions}"
                        th:value="${r.id}"
                        th:text="${r.name}"
                        th:selected="${regionId != null and regionId == r.id}"></option>
            </select>
        </div>
        <div class="min-w-[140px]">
            <label class="mb-1 block text-xs font-medium text-slate-500">Sede</label>
            <select name="branchId" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                <option value="">Principal</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"
                        th:selected="${branchId != null and branchId == b.id}"></option>
            </select>
        </div>
        <button type="submit"
                class="rounded-xl bg-sky-600 px-5 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Filtrar
        </button>
        <a th:href="@{/menu}" class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:text-sky-600">Limpiar</a>
    </form>
    <p th:if="${currentShiftLabel != null}" class="mb-4 text-sm text-slate-500">
        Turno actual: <span class="font-semibold text-slate-700" th:text="${currentShiftLabel}"></span>
    </p>
    <div th:if="${!hasMenu}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white p-12 text-center">
        <i class="bi bi-calendar-x text-3xl text-slate-300"></i>
        <p class="mt-3 font-medium text-slate-700">Hoy no hay menú publicado</p>
        <p class="mt-1 text-sm text-slate-500">Vuelve más tarde o prueba otra sede.</p>
    </div>

    <div th:if="${hasMenu and #lists.isEmpty(products)}"
         class="rounded-2xl border border-dashed border-slate-200 bg-white p-12 text-center text-slate-500">
        No hay platos con estos filtros
    </div>

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <article th:each="p : ${products}"
                 class="group flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:border-sky-200 hover:shadow-md">
            <div class="relative flex h-44 items-center justify-center bg-slate-100">
                <img th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                     th:src="${p.imageUrl}" th:alt="${p.name}"
                     class="h-full w-full object-cover">
                <i th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                   class="bi bi-egg-fried text-5xl text-slate-300"></i>
                <span th:if="${p.regionName != null}"
                      class="absolute left-3 top-3 rounded-full bg-white/90 px-2.5 py-0.5 text-[11px] font-semibold text-slate-700 shadow-sm"
                      th:text="${p.regionName}">Costa</span>
            </div>
            <div class="flex flex-1 flex-col p-4">
                <span class="text-xs font-medium uppercase tracking-wide text-sky-600"
                      th:text="${p.categoryName}">Categoría</span>
                <h2 class="mt-1 text-lg font-semibold text-slate-900" th:text="${p.name}">Nombre</h2>
                <p class="mt-1 line-clamp-2 flex-1 text-sm text-slate-500" th:text="${p.description}">Descripción</p>
                <div class="mt-4 flex items-center justify-between gap-2">
                    <div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-xl font-bold text-slate-900" th:text="${'S/ ' + #numbers.formatDecimal(p.salePrice(), 1, 2)}">S/ 0</span>
                            <span th:if="${p.onPromoPrice()}" class="text-sm text-slate-400 line-through" th:text="${'S/ ' + #numbers.formatDecimal(p.listPrice(), 1, 2)}"></span>
                        </div>
                        <span th:if="${p.soldOut()}" class="rounded-full bg-slate-200 px-2 py-0.5 text-xs font-semibold text-slate-600">Agotado</span>

                        <p th:if="${p.prepTimeMinutes != null}" class="text-xs text-slate-400">
                            <i class="bi bi-clock"></i>
                            <span th:text="${p.prepTimeMinutes + ' min'}"></span>
                        </p>
                    </div>

                    <th:block sec:authorize="isAuthenticated()">
                        <form th:if="${p.available()}" th:action="@{/customer/cart/items}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="productId" th:value="${p.id()}"/>
                            <input type="hidden" name="dailyMenuItemId" th:value="${p.dailyMenuItemId()}"/>
                            <input type="hidden" name="quantity" value="1"/>
                            <button type="submit" class="inline-flex items-center gap-1 rounded-xl bg-sky-600 px-3 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                                <i class="bi bi-cart-plus"></i> Agregar
                            </button>
                        </form>
                        <span th:if="${p.soldOut()}" class="text-sm text-slate-400">No disponible</span>
                    </th:block>
                    <th:block sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}"
                           class="inline-flex items-center gap-1 rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                            Entrar para pedir
                        </a>
                    </th:block>
                </div>
            </div>
        </article>
    </div>
</section>
</body>
</html>
