<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Acceso denegado</title>
</head>
<body>
<section layout:fragment="content" class="mx-auto max-w-lg px-4 py-16 text-center">
    <p class="text-5xl font-bold text-slate-300" th:text="${statusCode} ?: 403">403</p>
    <h1 class="mt-3 text-xl font-semibold text-slate-900" th:text="${title}">Acceso denegado</h1>
    <p class="mt-2 text-sm text-slate-500" th:text="${message}">Sin permiso</p>
    <div class="mt-8 flex justify-center gap-3">
        <a th:href="@{/}" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Inicio</a>
        <a th:href="@{/menu}" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Menú</a>
    </div>
</section>
</body>
</html>
