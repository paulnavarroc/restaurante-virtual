<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="es">
<head>
    <title>Error 403 | Acceso denegado</title>
</head>
<body>
<main layout:fragment="content" class="flex min-h-[75vh] items-center justify-center bg-slate-50 px-4 py-12">
    <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12">
        <div class="mx-auto mb-6 flex size-20 items-center justify-center rounded-2xl bg-rose-50 text-rose-600">
            <i class="bi bi-shield-lock text-4xl"></i>
        </div>
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-rose-600">Seguridad y permisos</p>
        <h1 class="mt-3 text-7xl font-extrabold tracking-tight text-slate-900">403</h1>
        <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-800">Acceso denegado</h2>
        <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-slate-500">No tienes los permisos necesarios para acceder a este recurso. Si consideras que se trata de un error, contacta con el administrador.</p>
        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
            <a th:href="@{/}" class="inline-flex items-center justify-center gap-2 rounded-lg bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
                <i class="bi bi-house-door"></i>
                Volver al inicio
            </a>
            <a th:href="@{/login}" class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
            </a>
        </div>
        <p class="mt-8 text-xs text-slate-400">Error 403 · Permisos insuficientes</p>
    </section>
</main>
</body>
</html>
