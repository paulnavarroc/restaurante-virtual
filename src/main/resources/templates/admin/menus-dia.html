<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Menús del día</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="mb-6 text-2xl font-bold">Menús del día</h1>

        <form method="get" class="mb-6 flex flex-wrap gap-3">
            <select name="sedeId" class="input w-56" onchange="this.form.submit()">
                <option th:each="s : ${sedes}" th:value="${s.id}" th:text="${s.nombre}"
                        th:selected="${s.id == sedeId}"></option>
            </select>
        </form>

        <form th:action="@{/admin/menus}" method="post" class="card mb-8 flex flex-wrap items-end gap-3 p-4">
            <input type="hidden" name="sedeId" th:value="${sedeId}">
            <div>
                <label class="mb-1 block text-sm font-medium">Nueva fecha</label>
                <input type="date" name="fecha" class="input" required th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
            </div>
            <button class="btn-primary">Crear borrador</button>
        </form>

        <div class="card overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">Fecha</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${menus}" class="border-t border-slate-100">
                    <td class="px-4 py-3" th:text="${m.fecha}"></td>
                    <td class="px-4 py-3"><span class="badge" th:text="${m.estado}"></span></td>
                    <td class="px-4 py-3 text-right">
                        <a th:href="@{/admin/menus/{id}(id=${m.id})}" class="btn-secondary !text-xs">Abrir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
