<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Insumo</title></head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold" th:text="${titulo}">Insumo</h1>
    <form th:action="${form.id() == null} ? @{/admin/ingredients} : @{/admin/ingredients/{id}(id=${form.id()})}"
          th:object="${form}" method="post"
          class="max-w-lg space-y-4 rounded-2xl border bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label class="mb-1 block text-sm font-medium">Nombre</label>
            <input type="text" th:field="*{name}" required class="w-full rounded-xl border px-3 py-2 text-sm">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Unidad</label>
            <input type="text" th:field="*{unit}" required placeholder="kg, L, und"
                   class="w-full rounded-xl border px-3 py-2 text-sm">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Alerta stock mínimo</label>
            <input type="number" step="0.0001" min="0" th:field="*{minStockAlert}"
                   class="w-full rounded-xl border px-3 py-2 text-sm">
        </div>
        <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" th:field="*{unlimitedStock}"> Stock ilimitado
        </label>
        <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" th:field="*{active}"> Activo
        </label>
        <button class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white">Guardar</button>
    </form>
</section>
</body>
</html>
