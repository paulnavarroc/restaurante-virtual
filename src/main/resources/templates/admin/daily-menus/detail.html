<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Detalle menú</title></head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <a th:href="@{/admin/daily-menus}" class="text-sm text-sky-600 hover:underline">← Menús</a>
            <h1 class="mt-1 text-xl font-bold text-slate-900">
                <span th:text="${menu.branchName()}"></span>
                · <span th:text="${menu.menuDate()}"></span>
            </h1>
            <span class="mt-1 inline-flex rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold" th:text="${menu.status()}"></span>
        </div>
        <div class="flex flex-wrap gap-2">
            <!-- Solo borrador (o cerrado si publicas directo; aquí publicamos solo desde DRAFT) -->
            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_PUBLISH')"
                  th:if="${menu.status() == 'DRAFT'}"
                  th:action="@{/admin/daily-menus/{id}/publish(id=${menu.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">
                    Publicar
                </button>
            </form>

            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                  th:if="${menu.status() == 'PUBLISHED'}"
                  th:action="@{/admin/daily-menus/{id}/unpublish(id=${menu.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="rounded-xl border border-amber-300 bg-amber-50 px-4 py-2 text-sm font-medium text-amber-900">
                    Despublicar
                </button>
            </form>

            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                  th:if="${menu.status() != 'CLOSED'}"
                  th:action="@{/admin/daily-menus/{id}/close(id=${menu.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="rounded-xl border border-slate-200 px-4 py-2 text-sm hover:bg-slate-50">
                    Cerrar
                </button>
            </form>

            <!-- Cerrado por error → volver a borrador -->
            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                  th:if="${menu.status() == 'CLOSED'}"
                  th:action="@{/admin/daily-menus/{id}/reopen(id=${menu.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                    Reabrir (borrador)
                </button>
            </form>

            <!-- Tras reabrir, si quieres publicar en un clic desde CLOSED: -->
            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_PUBLISH')"
                  th:if="${menu.status() == 'CLOSED'}"
                  th:action="@{/admin/daily-menus/{id}/publish(id=${menu.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">
                    Reabrir y publicar
                </button>
            </form>


            <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                  th:action="@{/admin/daily-menus/{id}/copy(id=${menu.id()})}"
                  method="post"
                  class="flex flex-wrap items-end gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div>
                    <label class="mb-0.5 block text-[11px] font-medium text-slate-500">Copiar a fecha</label>
                    <input type="date" name="targetDate" required class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
                <button type="submit" class="rounded-xl bg-sky-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-sky-700">
                    <i class="bi bi-copy"></i> Copiar menú
                </button>
            </form>
        </div>
    </div>

    <!-- Agregar producto -->
    <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
          th:if="${menu.status() != 'CLOSED'}"
          th:action="@{/admin/daily-menus/{id}/items(id=${menu.id()})}"
          th:object="${itemForm}" method="post"
          class="mb-6 flex flex-wrap items-end gap-3 rounded-2xl border bg-white p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="min-w-[200px] flex-1">
            <label class="mb-1 block text-xs font-medium text-slate-500">Producto</label>
            <select th:field="*{productId}" required class="w-full rounded-xl border px-3 py-2 text-sm">
                <option value="">Seleccione</option>
                <option th:each="p : ${products}" th:value="${p.id}"
                        th:text="${p.name + ' — S/ ' + p.basePrice}"></option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-xs font-medium text-slate-500">Precio override</label>
            <input type="number" step="0.01" min="0" th:field="*{priceOverride}"
                   class="w-28 rounded-xl border px-3 py-2 text-sm" placeholder="Opcional">
        </div>
        <div>
            <label class="mb-1 block text-xs font-medium text-slate-500">Cupo máx.</label>
            <input type="number" min="1" th:field="*{maxQuota}" class="w-24 rounded-xl border px-3 py-2 text-sm">
        </div>
        <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" th:field="*{available}"> Disponible
        </label>
        <button class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white">Agregar</button>
    </form>

    <div class="overflow-x-auto rounded-2xl border bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Producto</th>
                <th class="px-4 py-3">Precio lista</th>
                <th class="px-4 py-3">Precio menú</th>
                <th class="px-4 py-3">Cupo</th>
                <th class="px-4 py-3">Vendidos</th>
                <th class="px-4 py-3">Disp.</th>
                <th class="px-4 py-3">Turno</th>
                <th class="px-4 py-3"></th>
                <th class="px-4 py-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${menu.items()}" class="border-b border-slate-100">
                <td class="px-4 py-3 font-medium" th:text="${i.productName()}"></td>
                <td class="px-4 py-3" th:text="${'S/ ' + #numbers.formatDecimal(i.basePrice(), 1, 2)}"></td>
                <td class="px-4 py-3 font-semibold" th:text="${'S/ ' + #numbers.formatDecimal(i.effectivePrice(), 1, 2)}"></td>
                <td class="px-4 py-3" th:text="${i.maxQuota() != null ? i.maxQuota() : '—'}"></td>
                <td class="px-4 py-3" th:text="${i.soldQuantity()}"></td>
                <td class="px-4 py-3" th:text="${i.available() ? 'Sí' : 'No'}"></td>
                <td class="px-4 py-3 text-xs text-slate-600">
                    <span th:if="${#lists.isEmpty(i.shiftLabels())}">Todos</span>
                    <span th:each="lb, st : ${i.shiftLabels()}" th:text="${lb + (!st.last ? ', ' : '')}"></span>
                </td>
                <td class="px-4 py-3" sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                    th:if="${menu.status() != 'CLOSED'}">
                    <form th:action="@{/admin/daily-menus/{id}/items/{itemId}/shifts(id=${menu.id()}, itemId=${i.id()})}"
                          method="post" class="flex flex-wrap items-center gap-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <label th:each="s : ${branchShifts}" class="inline-flex items-center gap-1 text-xs">
                            <input type="checkbox" name="shiftIds" th:value="${s.id()}"
                                   th:checked="${i.shiftLabels() != null and i.shiftLabels().contains(s.label())}">
                            <span th:text="${s.label()}">Turno</span>
                        </label>
                        <button type="submit" class="text-xs font-medium text-sky-600 hover:underline">Guardar</button>
                    </form>
                </td>
                <td class="px-4 py-3 text-right">
                    <form sec:authorize="hasAuthority('PERM_DAILY_MENU_MANAGE')"
                          th:if="${menu.status() != 'CLOSED'}"
                          th:action="@{/admin/daily-menus/{id}/items/{itemId}/remove(id=${menu.id()}, itemId=${i.id()})}"
                          method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="text-red-600 hover:underline">Quitar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(menu.items())}">
                <td colspan="7" class="px-4 py-8 text-center text-slate-500">Sin productos</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
