<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Nuevo menú</title></head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold">Nuevo menú del día</h1>
    <form th:action="@{/admin/daily-menus}" th:object="${form}" method="post" class="max-w-md space-y-4 rounded-2xl border bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label class="mb-1 block text-sm font-medium">Sede</label>
            <select th:field="*{branchId}" required class="w-full rounded-xl border px-3 py-2 text-sm">
                <option value="">Seleccione</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Fecha</label>
            <input type="date" th:field="*{menuDate}" required class="w-full rounded-xl border px-3 py-2 text-sm">
        </div>
        <button class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white">Crear borrador</button>
    </form>
</section>
</body>
</html>
