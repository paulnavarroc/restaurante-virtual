<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head>
    <title th:text="${insumo.id != null} ? 'Editar insumo' : 'Nuevo insumo'">Insumo</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-lg px-4 py-8">
        <a th:href="@{/admin/insumos}" class="mb-4 inline-flex items-center gap-1 text-sm text-sky-700 hover:underline">
            <i class="bi bi-arrow-left"></i> Volver a insumos
        </a>

        <h1 class="mb-6 text-2xl font-bold text-slate-900"
            th:text="${insumo.id != null} ? 'Editar insumo' : 'Nuevo insumo'">
            Insumo
        </h1>

        <div th:if="${error}"
             class="mb-4 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-800"
             th:text="${error}"></div>

        <form th:object="${insumo}"
              th:action="${insumo.id != null} ? @{/admin/insumos/{id}(id=${insumo.id})} : @{/admin/insumos}"
              method="post"
              class="card space-y-4 p-6">

            <div>
                <label class="mb-1.5 block text-sm font-medium text-slate-700">Nombre *</label>
                <input type="text" th:field="*{nombre}" class="input" required
                       placeholder="Ej. Pescado blanco">
                <p class="mt-1 text-xs text-red-600" th:if="${#fields.hasErrors('nombre')}"
                   th:errors="*{nombre}"></p>
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium text-slate-700">Unidad *</label>
                <select th:field="*{unidad}" class="input" required>
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="L">L</option>
                    <option value="ml">ml</option>
                    <option value="und">und</option>
                </select>
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium text-slate-700">Stock mínimo de alerta</label>
                <input type="number" step="0.0001" min="0" th:field="*{stockMinimoAlerta}" class="input"
                       placeholder="Opcional">
                <p class="mt-1 text-xs text-slate-400">Se usa en el dashboard cuando el neto baja de este valor.</p>
            </div>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" th:field="*{stockIlimitado}"
                       class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                Stock ilimitado (no descuenta inventario)
            </label>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" th:field="*{activo}"
                       class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                Activo
            </label>

            <div class="flex flex-wrap gap-2 pt-2">
                <button type="submit" class="btn-primary">
                    <i class="bi bi-check-lg"></i> Guardar
                </button>
                <a th:href="@{/admin/insumos}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
