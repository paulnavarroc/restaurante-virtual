<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title th:text="${form.id != null} ? 'Editar sede' : 'Nueva sede'">Sede</title>
</head>
<body>
<th:block layout:fragment="pageTitle"
          th:text="${form.id != null} ? 'Editar sede' : 'Nueva sede'">Sede</th:block>

<section layout:fragment="content">
    <a th:href="@{/admin/branches}" class="text-sm font-medium text-sky-600 hover:underline">← Volver</a>
    <h2 class="mt-2 mb-6 text-xl font-bold text-slate-900"
        th:text="${form.id != null} ? 'Editar sede' : 'Nueva sede'">Sede</h2>

    <form th:object="${form}" method="post"
          th:action="${form.id != null}
              ? @{/admin/branches/{id}(id=${form.id})}
              : @{/admin/branches}"
          class="max-w-xl space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label class="block text-sm font-medium text-slate-700">Nombre</label>
            <input th:field="*{name}" type="text" required
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Dirección</label>
            <input th:field="*{address}" type="text" required
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Latitud</label>
                <input th:field="*{lat}" type="number" step="0.0000001" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Longitud</label>
                <input th:field="*{lng}" type="number" step="0.0000001" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Radio cobertura (km)</label>
                <input th:field="*{coverageRadiusKm}" type="number" step="0.01" min="0.1" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Teléfono</label>
                <input th:field="*{phone}" type="text"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Tenant key (opcional)</label>
            <input th:field="*{tenantKey}" type="text" placeholder="lima"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 font-mono text-sm"/>
        </div>
        <label class="inline-flex items-center gap-2 text-sm">
            <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600"/>
            Sede activa
        </label>

        <div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/branches}"
               class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm text-slate-700 hover:bg-slate-50">
                Cancelar
            </a>
        </div>
    </form>
</section>
</body>
</html>
