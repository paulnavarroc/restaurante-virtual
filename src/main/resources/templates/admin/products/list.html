<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Productos</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Productos</h1>
            <p class="text-sm text-slate-500">Catálogo maestro de platos</p>
        </div>
        <a sec:authorize="hasAuthority('PERM_PRODUCTS_CREATE')" th:href="@{/admin/products/new}" class="inline-flex items-center gap-1 rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            <i class="bi bi-plus-lg"></i> Nuevo
        </a>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Categoría</th>
                <th class="px-4 py-3">Región</th>
                <th class="px-4 py-3">Precio</th>
                <th class="px-4 py-3">Estado</th>
                <th class="px-4 py-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}" class="border-b border-slate-100">
                <td class="px-4 py-3 font-medium" th:text="${p.name()}"></td>
                <td class="px-4 py-3" th:text="${p.categoryName()}"></td>
                <td class="px-4 py-3" th:text="${p.regionName()}"></td>
                <td class="px-4 py-3"
                    th:text="${'S/ ' + #numbers.formatDecimal(p.basePrice(), 1, 2)}"></td>
                <td class="px-4 py-3">
                    <span th:if="${p.active()}" class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700">Activo</span>
                    <span th:unless="${p.active()}" class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">Inactivo</span>
                </td>
                <td class="px-4 py-3 text-right space-x-2">
                    <a sec:authorize="hasAuthority('PERM_PRODUCTS_EDIT')"
                       th:href="@{/admin/products/{id}/edit(id=${p.id()})}"
                       class="text-sky-600 hover:underline">Editar</a>
                    <a th:href="@{/admin/products/{id}/recipe(id=${p.id()})}" class="text-sky-300 hover:underline">Receta</a>
                    <form sec:authorize="hasAuthority('PERM_PRODUCTS_DELETE')"
                          th:if="${p.active()}"
                          th:action="@{/admin/products/{id}/deactivate(id=${p.id()})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-red-600 hover:underline">Desactivar</button>
                    </form>
                    <form sec:authorize="hasAuthority('PERM_PRODUCTS_EDIT')"
                          th:unless="${p.active()}"
                          th:action="@{/admin/products/{id}/activate(id=${p.id()})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-emerald-600 hover:underline">Activar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="px-4 py-10 text-center text-slate-500">Sin productos</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
