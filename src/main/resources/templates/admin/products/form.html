<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Producto</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold text-slate-900" th:text="${titulo}">Producto</h1>

    <form th:action="${form.id() == null} ? @{/admin/products} : @{/admin/products/{id}(id=${form.id()})}"
          th:object="${form}" method="post"
          class="max-w-2xl space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="mb-1 block text-sm font-medium">Nombre</label>
            <input type="text" th:field="*{name}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
            <p class="text-xs text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">Descripción</label>
            <textarea th:field="*{description}" rows="3" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-200"></textarea>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-sm font-medium">Categoría</label>
                <select th:field="*{categoryId}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                    <option value="">Seleccione</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium">Región</label>
                <select th:field="*{regionId}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                    <option value="">—</option>
                    <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.name}"></option>
                </select>
            </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-sm font-medium">Precio base (S/)</label>
                <input type="number" step="0.01" min="0" th:field="*{basePrice}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium">Tiempo prep. (min)</label>
                <input type="number" min="0" th:field="*{prepTimeMinutes}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">URL de imagen</label>
            <input type="text" th:field="*{imageUrl}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="https://... o /media/...">
        </div>

        <div class="flex flex-wrap gap-4 text-sm">
            <label class="inline-flex items-center gap-2">
                <input type="checkbox" th:field="*{unlimitedStock}" class="rounded border-slate-300 text-sky-600">
                Stock ilimitado (sin receta/stock)
            </label>
            <label class="inline-flex items-center gap-2">
                <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600">
                Activo
            </label>
        </div>

        <div class="flex gap-2 pt-2">
            <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/products}" class="rounded-xl px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
