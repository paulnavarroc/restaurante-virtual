<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Receta</title></head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <a th:href="@{/admin/products}" class="text-sm text-sky-600 hover:underline">← Productos</a>
        <h1 class="mt-1 text-xl font-bold text-slate-900">
            Receta: <span th:text="${recipe.productName()}">Producto</span>
        </h1>
        <p class="text-sm text-slate-500"
           th:text="${recipe.recipeId() != null ? 'Versión ' + recipe.version() : 'Sin receta aún'}"></p>
    </div>

    <form th:action="@{/admin/products/{id}/recipe(id=${recipe.productId()})}" method="post"
          class="space-y-4 rounded-2xl border bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div id="recipe-lines" class="space-y-3">
            <div th:each="it : ${items}" class="flex flex-wrap items-end gap-3 recipe-line">
                <div class="min-w-[200px] flex-1">
                    <label class="mb-1 block text-xs text-slate-500">Insumo</label>
                    <select name="ingredientId" required class="w-full rounded-xl border px-3 py-2 text-sm">
                        <option th:each="ing : ${ingredients}" th:value="${ing.id}"
                                th:text="${ing.name + ' (' + ing.unit + ')'}"
                                th:selected="${ing.id == it.ingredientId()}"></option>
                    </select>
                </div>
                <div>
                    <label class="mb-1 block text-xs text-slate-500">Cantidad</label>
                    <input type="number" step="0.0001" min="0.0001" name="quantity" required
                           th:value="${it.quantity()}" class="w-32 rounded-xl border px-3 py-2 text-sm">
                </div>
            </div>

            <!-- línea vacía para agregar -->
            <div class="flex flex-wrap items-end gap-3 recipe-line">
                <div class="min-w-[200px] flex-1">
                    <label class="mb-1 block text-xs text-slate-500">Insumo</label>
                    <select name="ingredientId" class="w-full rounded-xl border px-3 py-2 text-sm">
                        <option value="">—</option>
                        <option th:each="ing : ${ingredients}" th:value="${ing.id}"
                                th:text="${ing.name + ' (' + ing.unit + ')'}"></option>
                    </select>
                </div>
                <div>
                    <label class="mb-1 block text-xs text-slate-500">Cantidad</label>
                    <input type="number" step="0.0001" min="0.0001" name="quantity"
                           class="w-32 rounded-xl border px-3 py-2 text-sm">
                </div>
            </div>
        </div>

        <p class="text-xs text-slate-400">Deja el insumo vacío en filas que no uses. Al guardar se reemplaza toda la receta.</p>

        <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            Guardar receta
        </button>
    </form>
</section>
</body>
</html>
