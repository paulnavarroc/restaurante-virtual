<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="es">
<head>
    <title>Clientes</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-8">

        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">
                    <i class="bi bi-person-lines-fill text-sky-600"></i>
                    Clientes
                </h1>
                <p class="text-sm text-slate-500">Registro de clientes y último acceso</p>
            </div>
            <a th:href="@{/admin/usuarios(rol=CLIENTE)}" class="btn-secondary !text-sm">
                <i class="bi bi-people"></i> Ver en usuarios
            </a>
        </div>

        <div th:if="${clientes == null or #lists.isEmpty(clientes)}"
             class="card px-6 py-16 text-center text-slate-500">
            <i class="bi bi-inbox text-4xl text-slate-300"></i>
            <p class="mt-3">Aún no hay clientes registrados.</p>
        </div>

        <div th:if="${clientes != null and !#lists.isEmpty(clientes)}" class="card overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3 font-medium">Cliente</th>
                    <th class="px-4 py-3 font-medium">Documento</th>
                    <th class="px-4 py-3 font-medium">Teléfono</th>
                    <th class="px-4 py-3 font-medium">Registro</th>
                    <th class="px-4 py-3 font-medium">Último acceso</th>
                    <th class="px-4 py-3 font-medium">IP</th>
                    <th class="px-4 py-3 font-medium">Estado</th>
                    <th class="px-4 py-3"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}" class="border-t border-slate-100 hover:bg-sky-50/40">
                    <td class="px-4 py-3">
                        <div class="font-medium text-slate-900"
                             th:text="${c.usuario.nombre + ' ' + c.usuario.apellido}">Ana Cliente</div>
                        <div class="text-xs text-slate-500" th:text="${c.usuario.correo}">correo@mail.com</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">
                        <span th:if="${c.documentoTipo != null or c.documentoNumero != null}"
                              th:text="${(c.documentoTipo ?: '') + ' ' + (c.documentoNumero ?: '')}">DNI</span>
                        <span th:if="${c.documentoTipo == null and c.documentoNumero == null}">—</span>
                    </td>
                    <td class="px-4 py-3" th:text="${c.usuario.telefono} ?: '—'">999</td>
                    <td class="px-4 py-3 text-xs text-slate-600"
                        th:text="${c.fechaRegistro != null ? #temporals.format(c.fechaRegistro, 'dd/MM/yyyy HH:mm') : '—'}">
                    </td>
                    <td class="px-4 py-3 text-xs text-slate-600"
                        th:text="${c.usuario.ultimoAcceso != null ? #temporals.format(c.usuario.ultimoAcceso, 'dd/MM/yyyy HH:mm') : 'Nunca'}">
                    </td>
                    <td class="px-4 py-3 text-xs font-mono text-slate-500"
                        th:text="${c.usuario.ultimaIp} ?: '—'"></td>
                    <td class="px-4 py-3">
                        <span th:if="${c.usuario.activo}"
                              class="inline-flex items-center gap-1 text-emerald-600">
                            <i class="bi bi-check-circle-fill"></i> Activo
                        </span>
                        <span th:if="${!c.usuario.activo}"
                              class="inline-flex items-center gap-1 text-slate-400">
                            <i class="bi bi-pause-circle"></i> Inactivo
                        </span>
                    </td>
                    <td class="px-4 py-3 text-right">
                        <a th:href="@{/admin/auditoria/usuario/{id}(id=${c.usuario.id})}"
                           class="btn-ghost !text-xs">
                            <i class="bi bi-shield-lock"></i> Accesos
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
