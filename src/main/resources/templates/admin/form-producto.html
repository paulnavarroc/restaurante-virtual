<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head>
    <title th:text="${producto.id != null} ? 'Editar producto' : 'Nuevo producto'">Producto</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-xl px-4 py-8">
        <a th:href="@{/admin/productos}" class="text-sm text-sky-700">← Productos</a>
        <h1 class="mt-2 mb-6 text-2xl font-bold"
            th:text="${producto.id != null} ? 'Editar producto' : 'Nuevo producto'"></h1>

        <form th:object="${producto}"
              th:action="${producto.id != null} ? @{/admin/productos/{id}(id=${producto.id})} : @{/admin/productos}"
              method="post"
              class="card space-y-4 p-6">

            <div>
                <label class="mb-1.5 block text-sm font-medium">Nombre *</label>
                <input type="text" th:field="*{nombre}" class="input" required>
                <p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium">Descripción</label>
                <textarea th:field="*{descripcion}" rows="3" class="input"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Precio base (S/) *</label>
                    <input type="number" step="0.01" min="0" th:field="*{precioBase}" class="input" required>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Tiempo prep. (min)</label>
                    <input type="number" min="1" th:field="*{tiempoPreparacionMin}" class="input">
                </div>
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium">URL de imagen</label>
                <input type="url" th:field="*{imagenUrl}" class="input"
                       placeholder="https://... o /media/productos/...">
                <p class="mt-1 text-xs text-slate-400">
                    Por ahora pega una URL. Luego se podrá subir archivo al servidor.
                </p>
                <img th:if="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}"
                     th:src="*{imagenUrl}" alt="Vista previa"
                     class="mt-3 h-32 w-full rounded-xl object-cover ring-1 ring-slate-200">
            </div>

            <div th:if="${producto.id != null}" class="card mt-6 space-y-3 p-6">
                <h2 class="font-semibold">Imagen del producto</h2>

                <img th:if="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}"
                     th:src="@{${producto.imagenUrl}}"
                     alt="Vista previa"
                     class="h-40 w-full rounded-xl object-cover ring-1 ring-slate-200">

                <form th:action="@{/admin/productos/{id}/imagen(id=${producto.id})}"
                      method="post"
                      enctype="multipart/form-data"
                      class="space-y-3">
                    <input type="file" name="archivo" accept="image/jpeg,image/png,image/webp,image/gif"
                           class="input" required>
                    <p class="text-xs text-slate-400">JPG, PNG, WEBP o GIF. Máx. 5 MB.</p>
                    <button type="submit" class="btn-primary">Subir imagen</button>
                </form>

                <p class="text-xs text-slate-500">
                    También puedes pegar una URL en el formulario de arriba (sin subir archivo).
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Categoría *</label>
                    <select th:field="*{categoriaId}" class="input" required>
                        <option value="">Selecciona</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Región</label>
                    <select th:field="*{regionId}" class="input">
                        <option value="">—</option>
                        <option th:each="r : ${regiones}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                </div>
            </div>

            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" th:field="*{stockIlimitado}" class="rounded text-sky-600">
                Stock ilimitado (no usa receta/insumos)
            </label>

            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" th:field="*{activo}" class="rounded text-sky-600">
                Activo en el catálogo maestro
            </label>

            <div class="flex gap-2 pt-2">
                <button type="submit" class="btn-primary">Guardar</button>
                <a th:href="@{/admin/productos}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
