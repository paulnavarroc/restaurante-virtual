<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Producto</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-xl px-4 py-10">
        <h1 class="mb-6 text-2xl font-bold"
            th:text="${productoId != null} ? 'Editar producto' : 'Nuevo producto'">Producto</h1>

        <form th:action="${productoId != null} ? @{/admin/productos/{id}(id=${productoId})} : @{/admin/productos}"
              th:object="${producto}" method="post" class="card space-y-4 p-6">
            <div>
                <label class="mb-1.5 block text-sm font-medium">Nombre *</label>
                <input type="text" th:field="*{nombre}" required class="input">
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium">Descripción</label>
                <textarea th:field="*{descripcion}" rows="3" class="input"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Precio *</label>
                    <input type="number" step="0.01" min="0" th:field="*{precio}" required class="input">
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Tiempo (min)</label>
                    <input type="number" th:field="*{tiempoPreparacion}" class="input">
                </div>
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium">URL imagen</label>
                <input type="url" th:field="*{imagenUrl}" class="input">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Región *</label>
                    <select th:field="*{regionId}" required class="input">
                        <option value="1">Costa</option>
                        <option value="2">Sierra</option>
                        <option value="3">Selva</option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium">Categoría *</label>
                    <select th:field="*{categoriaId}" required class="input">
                        <option value="1">Entradas</option>
                        <option value="2">Platos de fondo</option>
                        <option value="3">Postres</option>
                        <option value="4">Bebidas</option>
                        <option value="5">Combos</option>
                    </select>
                </div>
            </div>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" th:field="*{disponible}" class="rounded text-sky-600">
                Disponible
            </label>
            <div class="flex gap-2">
                <button type="submit" class="btn-primary">Guardar</button>
                <a th:href="@{/admin/productos}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
