<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Clientes</title></head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <h1 class="text-xl font-bold text-slate-900">Clientes</h1>
        <p class="text-sm text-slate-500">Usuarios con perfil de cliente</p>
    </div>

    <form method="get" th:action="@{/admin/customers}"
          class="mb-4 flex flex-wrap gap-2 rounded-2xl border border-slate-200 bg-white p-4">
        <input type="search" name="q" th:value="${q}" placeholder="Nombre, correo o documento"
               class="min-w-[220px] flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm
                      focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
        <button class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-medium text-white">Buscar</button>
        <a th:href="@{/admin/customers}" class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:text-sky-600">Limpiar</a>
    </form>

    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Cliente</th>
                <th class="px-4 py-3">Documento</th>
                <th class="px-4 py-3">Teléfono</th>
                <th class="px-4 py-3">Pedidos</th>
                <th class="px-4 py-3">Estado</th>
                <th class="px-4 py-3">Alta</th>
                <th class="px-4 py-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}" class="border-b border-slate-100 hover:bg-slate-50">
                <td class="px-4 py-3">
                    <div class="font-medium" th:text="${c.fullName()}"></div>
                    <div class="text-xs text-slate-400" th:text="${c.email()}"></div>
                </td>
                <td class="px-4 py-3 text-xs"
                    th:text="${(c.documentType() != null ? c.documentType() + ' ' : '') + (c.documentNumber() != null ? c.documentNumber() : '—')}"></td>
                <td class="px-4 py-3" th:text="${c.phone() != null ? c.phone() : '—'}"></td>
                <td class="px-4 py-3" th:text="${c.orderCount()}"></td>
                <td class="px-4 py-3">
                    <span th:if="${c.userActive()}" class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700">Activo</span>
                    <span th:unless="${c.userActive()}" class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">Inactivo</span>
                </td>
                <td class="px-4 py-3 text-xs text-slate-500"
                    th:text="${c.registeredAt() != null} ? ${#temporals.format(c.registeredAt(), 'dd/MM/yyyy')} : '—'"></td>
                <td class="px-4 py-3 text-right">
                    <a th:href="@{/admin/customers/{id}(id=${c.id()})}" class="text-sky-600 hover:underline">Ver</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="7" class="px-4 py-10 text-center text-slate-500">No hay clientes</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
