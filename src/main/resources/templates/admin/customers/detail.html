<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Cliente</title></head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <a th:href="@{/admin/customers}" class="text-sm text-sky-600 hover:underline">← Clientes</a>
            <h1 class="mt-1 text-xl font-bold text-slate-900"
                th:text="${customer.firstName() + ' ' + customer.lastName()}">Cliente</h1>
            <p class="text-sm text-slate-500" th:text="${customer.email()}"></p>
        </div>
        <div class="flex flex-wrap gap-2" sec:authorize="hasAuthority('PERM_CUSTOMERS_EDIT')">
            <form th:if="${customer.userActive()}"
                  th:action="@{/admin/customers/{id}/deactivate(id=${customer.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="rounded-xl border border-red-200 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                    Desactivar acceso
                </button>
            </form>
            <form th:unless="${customer.userActive()}"
                  th:action="@{/admin/customers/{id}/activate(id=${customer.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white">
                    Activar acceso
                </button>
            </form>
        </div>
    </div>

    <div class="grid gap-6 lg:grid-cols-3">
        <div class="space-y-4 lg:col-span-1">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm text-sm">
                <h2 class="font-semibold text-slate-900">Datos</h2>
                <dl class="mt-3 space-y-2">
                    <div>
                        <dt class="text-xs text-slate-400">Teléfono</dt>
                        <dd th:text="${customer.phone() != null ? customer.phone() : '—'}"></dd>
                    </div>
                    <div>
                        <dt class="text-xs text-slate-400">Documento</dt>
                        <dd th:text="${(customer.documentType() != null ? customer.documentType() + ' ' : '') + (customer.documentNumber() != null ? customer.documentNumber() : '—')}"></dd>
                    </div>
                    <div>
                        <dt class="text-xs text-slate-400">Registro</dt>
                        <dd th:text="${customer.registeredAt() != null} ? ${#temporals.format(customer.registeredAt(), 'dd/MM/yyyy HH:mm')} : '—'"></dd>
                    </div>
                    <div>
                        <dt class="text-xs text-slate-400">Último acceso</dt>
                        <dd th:text="${customer.lastAccessAt() != null} ? ${#temporals.format(customer.lastAccessAt(), 'dd/MM/yyyy HH:mm')} : '—'"></dd>
                    </div>
                    <div>
                        <dt class="text-xs text-slate-400">Estado</dt>
                        <dd th:text="${customer.userActive() ? 'Activo' : 'Inactivo'}"></dd>
                    </div>
                </dl>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm text-sm">
                <h2 class="font-semibold text-slate-900">Direcciones</h2>
                <ul class="mt-3 space-y-2" th:if="${!#lists.isEmpty(customer.addresses())}">
                    <li th:each="a : ${customer.addresses()}" class="rounded-lg border border-slate-100 p-2">
                        <span class="font-medium" th:text="${a.alias() != null ? a.alias() : 'Dirección'}"></span>
                        <span th:if="${a.primary()}" class="ml-1 text-xs text-sky-600">Principal</span>
                        <p class="text-slate-600" th:text="${a.line()}"></p>
                        <p class="text-xs text-slate-400" th:text="${a.districtName()}"></p>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(customer.addresses())}" class="mt-2 text-slate-400">Sin direcciones</p>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
                <div class="border-b border-slate-100 px-5 py-4 font-semibold text-slate-900">
                    Pedidos recientes
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                        <tr>
                            <th class="px-5 py-3">#</th>
                            <th class="px-5 py-3">Estado</th>
                            <th class="px-5 py-3">Sede</th>
                            <th class="px-5 py-3">Total</th>
                            <th class="px-5 py-3">Fecha</th>
                            <th class="px-5 py-3"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${customer.recentOrders()}" class="border-t border-slate-100">
                            <td class="px-5 py-3 font-medium" th:text="${o.id()}"></td>
                            <td class="px-5 py-3" th:text="${o.statusName()}"></td>
                            <td class="px-5 py-3" th:text="${o.branchName()}"></td>
                            <td class="px-5 py-3"
                                th:text="${'S/ ' + #numbers.formatDecimal(o.total(), 1, 2)}"></td>
                            <td class="px-5 py-3 text-slate-500" th:text="${o.orderedAtLabel()}"></td>
                            <td class="px-5 py-3 text-right">
                                <a th:href="@{/admin/orders/{id}(id=${o.id()})}"
                                   class="text-sky-600 hover:underline">Ver</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(customer.recentOrders())}">
                            <td colspan="6" class="px-5 py-8 text-center text-slate-500">Sin pedidos</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
