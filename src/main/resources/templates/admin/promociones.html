<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Promociones</title></head>
<body>
<main layout:fragment="content">

    <section class="mx-auto max-w-6xl px-4 py-8">
        <div class="mb-6 flex justify-between">
            <h1 class="text-2xl font-bold">Promociones</h1>
            <a th:href="@{/admin/promociones/nueva}" class="btn-primary">+ Nueva</a>
        </div>
        <div class="card overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3">Tipo</th>
                    <th class="px-4 py-3">Valor</th>
                    <th class="px-4 py-3">Vigencia</th>
                    <th class="px-4 py-3">Usos</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${promociones}" class="border-t">
                    <td class="px-4 py-3 font-medium" th:text="${p.nombre}"></td>
                    <td class="px-4 py-3"><span class="badge" th:text="${p.tipo}"></span></td>
                    <td class="px-4 py-3" th:text="${p.valor}"></td>
                    <td class="px-4 py-3 text-xs"
                        th:text="${#temporals.format(p.fechaHoraInicio,'dd/MM HH:mm')} + ' → ' + ${#temporals.format(p.fechaHoraFin,'dd/MM HH:mm')}"></td>
                    <td class="px-4 py-3"
                        th:text="${p.usosActuales} + (${p.cupoGlobal != null} ? '/' + ${p.cupoGlobal} : '')"></td>
                    <td class="px-4 py-3">
                        <span th:if="${p.activa}" class="text-emerald-600">Activa</span>
                        <span th:if="${!p.activa}" class="text-slate-400">Inactiva</span>
                    </td>
                    <td class="px-4 py-3 text-right space-x-1">
                        <a th:href="@{/admin/promociones/{id}/editar(id=${p.id})}" class="btn-secondary !text-xs">Editar</a>
                        <form th:action="@{/admin/promociones/{id}/activar(id=${p.id})}" method="post" class="inline">
                            <input type="hidden" name="activa" th:value="${!p.activa}">
                            <button class="btn-ghost !text-xs" th:text="${p.activa} ? 'Off' : 'On'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
