<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Productos</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold">Productos</h1>
            <a th:href="@{/admin/productos/nuevo}" class="btn-primary !text-sm">
                <i class="bi bi-plus-lg"></i> Nuevo
            </a>
        </div>

        <div class="card overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-slate-100 bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3">Región</th>
                    <th class="px-4 py-3">Precio</th>
                    <th class="px-4 py-3">Disponible</th>
                    <th class="px-4 py-3">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}" class="border-b border-slate-50">
                    <td class="px-4 py-3" th:text="${p.id}"></td>
                    <td class="px-4 py-3 font-medium" th:text="${p.nombre}"></td>
                    <td class="px-4 py-3" th:text="${p.region}"></td>
                    <td class="px-4 py-3" th:text="'S/ ' + ${p.precio}"></td>
                    <td class="px-4 py-3">
                        <span th:if="${p.disponible}" class="text-emerald-600">Sí</span>
                        <span th:unless="${p.disponible}" class="text-red-600">No</span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex gap-2">
                            <a th:href="@{/admin/productos/{id}/editar(id=${p.id})}" class="btn-secondary !text-xs">Editar</a>
                            <form th:action="@{/admin/productos/{id}/disponibilidad(id=${p.id})}" method="post">
                                <input type="hidden" name="disponible" th:value="${!p.disponible}">
                                <button class="btn-ghost !text-xs" th:text="${p.disponible} ? 'Desactivar' : 'Activar'"></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
