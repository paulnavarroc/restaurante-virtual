<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Entrada de stock</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold text-slate-900">Entrada de stock</h1>

    <form th:action="@{/admin/stock/entry}" th:object="${form}" method="post"
          class="max-w-lg space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="mb-1 block text-sm font-medium">Sede</label>
            <select th:field="*{branchId}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                <option value="">Seleccione</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Insumo</label>
            <select th:field="*{ingredientId}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                <option value="">Seleccione</option>
                <option th:each="i : ${ingredients}" th:value="${i.id}"
                        th:text="${i.name + ' (' + i.unit + ')'}"></option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Cantidad</label>
            <input type="number" step="0.0001" min="0.0001" th:field="*{quantity}" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Costo unitario (opcional)</label>
            <input type="number" step="0.0001" min="0" th:field="*{unitCost}"
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Notas</label>
            <textarea th:field="*{notes}" rows="2"
                      class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm"></textarea>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar entrada
            </button>
            <a th:href="@{/admin/stock}" class="rounded-xl px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
