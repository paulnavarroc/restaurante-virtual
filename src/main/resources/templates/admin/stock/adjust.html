<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Ajuste de stock</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold text-slate-900">Ajuste de stock</h1>
    <form th:action="@{/admin/stock/adjust}" th:object="${form}" method="post"
          class="max-w-lg space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{branchId}"/>
        <input type="hidden" th:field="*{ingredientId}"/>

        <p class="text-sm text-slate-600">
            Sede id: <span th:text="*{branchId}"></span> ·
            Insumo id: <span th:text="*{ingredientId}"></span>
        </p>
        <div>
            <label class="mb-1 block text-sm font-medium">Nuevo disponible</label>
            <input type="number" step="0.0001" min="0" th:field="*{newAvailableQuantity}" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Motivo</label>
            <textarea th:field="*{notes}" rows="2" required
                      class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm"
                      placeholder="Inventario físico, merma, etc."></textarea>
        </div>
        <button type="submit" class="rounded-xl bg-amber-600 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-700">
            Aplicar ajuste
        </button>
    </form>
</section>
</body>
</html>
