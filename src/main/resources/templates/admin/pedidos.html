<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<body>
<div th:fragment="content">

    <h1>📦 Todos los Pedidos</h1>

    <div th:if="${pedidos.isEmpty()}" class="empty">
        <p>No hay pedidos registrados.</p>
    </div>

    <table class="tabla-simple" th:if="${!pedidos.isEmpty()}">
        <thead>
        <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Total</th>
            <th>Dirección</th>
            <th>Items</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
            <td th:text="${p.id}"></td>
            <td th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>
            <td><span class="badge" th:text="${p.estado}"></span></td>
            <td th:text="'S/ ' + ${p.total}"></td>
            <td th:text="${p.direccion}" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></td>
            <td th:text="${p.items.size()}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
