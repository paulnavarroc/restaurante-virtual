<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Usuarios</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold"><i class="bi bi-people text-sky-600"></i> Usuarios</h1>
            <a th:href="@{/admin/usuarios/nuevo}" class="btn-primary !text-sm"><i class="bi bi-plus-lg"></i> Nuevo</a>
        </div>

        <form method="get" class="mb-4 flex gap-2">
            <select name="rol" class="input w-52" onchange="this.form.submit()">
                <option value="">Todos los roles</option>
                <option th:each="r : ${ {'CLIENTE','CHEF','REPARTIDOR','OPERACIONES','ADMINISTRADOR'} }"
                        th:value="${r}" th:text="${r}" th:selected="${rolFiltro == r}"></option>
            </select>
        </form>

        <div class="card overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">Usuario</th>
                    <th class="px-4 py-3">Roles</th>
                    <th class="px-4 py-3">Sede</th>
                    <th class="px-4 py-3">Último acceso</th>
                    <th class="px-4 py-3">IP</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}" class="border-t border-slate-100">
                    <td class="px-4 py-3">
                        <div class="font-medium" th:text="${u.nombre + ' ' + u.apellido}"></div>
                        <div class="text-xs text-slate-500" th:text="${u.correo}"></div>
                    </td>
                    <td class="px-4 py-3">
                        <span th:each="r : ${u.roles}" class="badge mr-1" th:text="${r}"></span>
                    </td>
                    <td class="px-4 py-3" th:text="${u.sedeNombre} ?: '—'"></td>
                    <td class="px-4 py-3 text-xs"
                        th:text="${u.ultimoAcceso != null ? #temporals.format(u.ultimoAcceso,'dd/MM/yyyy HH:mm') : 'Nunca'}"></td>
                    <td class="px-4 py-3 text-xs" th:text="${u.ultimaIp} ?: '—'"></td>
                    <td class="px-4 py-3">
                        <span th:if="${u.activo}" class="text-emerald-600">Activo</span>
                        <span th:if="${!u.activo}" class="text-slate-400">Inactivo</span>
                    </td>
                    <td class="px-4 py-3 text-right space-x-1">
                        <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}" class="btn-secondary !text-xs">Editar</a>
                        <a th:href="@{/admin/auditoria/usuario/{id}(id=${u.id})}" class="btn-ghost !text-xs">Accesos</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
