<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head>
    <title>Stock</title>
</head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">
                    <i class="bi bi-clipboard-data text-sky-600"></i> Stock por sede
                </h1>
                <p class="text-sm text-slate-500">Disponible, reservado y alertas de mínimo</p>
            </div>
            <a th:href="@{/admin/stock/entrada(sedeId=${sedeId})}" class="btn-primary !text-sm">
                <i class="bi bi-plus-circle"></i> Registrar entrada
            </a>
        </div>

        <form method="get" th:action="@{/admin/stock}" class="mb-6 flex flex-wrap items-end gap-3">
            <div>
                <label class="mb-1.5 block text-sm font-medium text-slate-700">Sede</label>
                <select name="sedeId" class="input w-64" onchange="this.form.submit()">
                    <option th:each="s : ${sedes}"
                            th:value="${s.id}"
                            th:text="${s.nombre}"
                            th:selected="${sedeId != null and sedeId == s.id}"></option>
                </select>
            </div>
        </form>

        <div th:if="${stocks == null or #lists.isEmpty(stocks)}"
             class="card px-6 py-16 text-center text-slate-500">
            <i class="bi bi-archive text-4xl text-slate-300"></i>
            <p class="mt-3">No hay stock cargado para esta sede.</p>
            <a th:href="@{/admin/stock/entrada(sedeId=${sedeId})}"
               class="btn-primary mt-4 inline-flex !text-sm">Cargar entrada</a>
        </div>

        <div th:if="${stocks != null and !#lists.isEmpty(stocks)}" class="card overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3 font-medium">Insumo</th>
                    <th class="px-4 py-3 font-medium">Disponible</th>
                    <th class="px-4 py-3 font-medium">Reservado</th>
                    <th class="px-4 py-3 font-medium">Neto</th>
                    <th class="px-4 py-3 font-medium">Últ. costo</th>
                    <th class="px-4 py-3 font-medium">Alerta</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${stocks}"
                    class="border-t border-slate-100"
                    th:classappend="${s.alertaMinimo} ? 'bg-red-50' : 'hover:bg-sky-50/40'">
                    <td class="px-4 py-3 font-medium text-slate-900" th:text="${s.insumoNombre}"></td>
                    <td class="px-4 py-3"
                        th:text="${s.cantidadDisponible} + ' ' + ${s.unidad}"></td>
                    <td class="px-4 py-3 text-amber-700"
                        th:text="${s.cantidadReservada}"></td>
                    <td class="px-4 py-3 font-semibold text-sky-700"
                        th:text="${s.disponibleNeto}"></td>
                    <td class="px-4 py-3 text-slate-600"
                        th:text="${s.ultimoCosto != null ? 'S/ ' + #numbers.formatDecimal(s.ultimoCosto,1,2) : '—'}"></td>
                    <td class="px-4 py-3">
                        <span th:if="${s.alertaMinimo}"
                              class="inline-flex items-center gap-1 font-medium text-red-600">
                            <i class="bi bi-exclamation-triangle-fill"></i> Bajo
                        </span>
                        <span th:if="${!s.alertaMinimo}" class="text-emerald-600">
                            <i class="bi bi-check-circle"></i> OK
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
