<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Reportes</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <h1 class="mb-6 text-2xl font-bold">Reportes</h1>

        <div class="mb-8 flex flex-wrap gap-3">
            <a th:href="@{/admin/reportes/ventas/excel}" class="btn-primary !text-sm">
                <i class="bi bi-download"></i> Ventas Excel
            </a>
            <a th:href="@{/admin/reportes/productos/excel}" class="btn-secondary !text-sm">
                <i class="bi bi-download"></i> Top productos Excel
            </a>
        </div>

        <h2 class="mb-3 font-semibold">Productos más vendidos</h2>
        <div class="card mb-8 overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">#</th>
                    <th class="px-4 py-3">Producto</th>
                    <th class="px-4 py-3">Región</th>
                    <th class="px-4 py-3">Cantidad</th>
                    <th class="px-4 py-3">Monto</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, st : ${topProductos}" class="border-t border-slate-50">
                    <td class="px-4 py-3" th:text="${st.count}"></td>
                    <td class="px-4 py-3" th:text="${p.nombre}"></td>
                    <td class="px-4 py-3" th:text="${p.region}"></td>
                    <td class="px-4 py-3" th:text="${p.cantidadVendida}"></td>
                    <td class="px-4 py-3" th:text="'S/ ' + ${p.montoTotal}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2 class="mb-3 font-semibold">Últimas ventas</h2>
        <div class="card overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Fecha</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3">Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${ventas}" class="border-t border-slate-50">
                    <td class="px-4 py-3" th:text="${v.pedidoId}"></td>
                    <td class="px-4 py-3" th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="px-4 py-3"><span class="badge" th:text="${v.estado}"></span></td>
                    <td class="px-4 py-3" th:text="'S/ ' + ${v.total}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
