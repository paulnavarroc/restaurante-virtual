<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Promociones</title>
</head>
<body>
<th:block layout:fragment="pageTitle">Promociones</th:block>

<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div>
            <h2 class="text-xl font-bold text-slate-900">Promociones</h2>
            <p class="mt-1 text-sm text-slate-500">Descuentos automáticos y por alcance</p>
        </div>
        <a sec:authorize="hasAuthority('PERM_PROMOTIONS_MANAGE')"
           th:href="@{/admin/promotions/new}"
           class="inline-flex items-center gap-1 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
            <i class="bi bi-plus-lg"></i> Nueva promoción
        </a>
    </div>

    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
                <thead class="border-b border-slate-100 bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-4 py-3">Código</th>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3">Tipo</th>
                    <th class="px-4 py-3">Alcance</th>
                    <th class="px-4 py-3">Vigencia</th>
                    <th class="px-4 py-3">Auto</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3"></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="p : ${promotions}" class="hover:bg-slate-50/80">
                    <td class="px-4 py-3 font-mono text-xs text-slate-700"
                        th:text="${p.code != null ? p.code : '—'}">—</td>
                    <td class="px-4 py-3 font-medium text-slate-900" th:text="${p.name}">Promo</td>
                    <td class="px-4 py-3">
                        <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-700"
                              th:text="${p.promoType}">PERCENT</span>
                    </td>
                    <td class="px-4 py-3 text-slate-600" th:text="${p.scope}">ORDER</td>
                    <td class="px-4 py-3 text-slate-600 whitespace-nowrap text-xs">
                        <span th:text="${p.startsAt != null ? #temporals.format(p.startsAt, 'dd/MM/yy HH:mm') : '—'}"></span>
                        <span class="text-slate-400"> → </span>
                        <span th:text="${p.endsAt != null ? #temporals.format(p.endsAt, 'dd/MM/yy HH:mm') : '—'}"></span>
                    </td>
                    <td class="px-4 py-3">
                        <span th:if="${p.automatic}" class="text-xs font-semibold text-sky-700">Sí</span>
                        <span th:unless="${p.automatic}" class="text-xs text-slate-400">No</span>
                    </td>
                    <td class="px-4 py-3">
                        <span th:if="${p.active}"
                              class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700">Activa</span>
                        <span th:unless="${p.active}"
                              class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-600">Inactiva</span>
                    </td>
                    <td class="px-4 py-3 text-right whitespace-nowrap">
                        <a sec:authorize="hasAuthority('PERM_PROMOTIONS_MANAGE')"
                           th:href="@{/admin/promotions/{id}/edit(id=${p.id})}"
                           class="text-sky-600 hover:underline">Editar</a>
                        <form sec:authorize="hasAuthority('PERM_PROMOTIONS_MANAGE')"
                              th:if="${p.active}"
                              th:action="@{/admin/promotions/{id}/deactivate(id=${p.id})}"
                              method="post" class="ml-2 inline"
                              onsubmit="return confirm('¿Desactivar esta promoción?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="text-xs text-red-600 hover:underline">Desactivar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${promotions == null or #lists.isEmpty(promotions)}">
                    <td colspan="8" class="px-4 py-12 text-center text-slate-500">
                        No hay promociones. Crea la primera.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
