<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title th:text="${form.id != null} ? 'Editar promoción' : 'Nueva promoción'">Promoción</title>
</head>
<body>
<th:block layout:fragment="pageTitle"
          th:text="${form.id != null} ? 'Editar promoción' : 'Nueva promoción'">Promoción</th:block>

<section layout:fragment="content">
    <a th:href="@{/admin/promotions}" class="text-sm font-medium text-sky-600 hover:underline">← Volver</a>
    <h2 class="mt-2 mb-6 text-xl font-bold text-slate-900"
        th:text="${form.id != null} ? 'Editar promoción' : 'Nueva promoción'">Promoción</h2>

    <form th:object="${form}" method="post"
          th:action="${form.id != null}
              ? @{/admin/promotions/{id}(id=${form.id})}
              : @{/admin/promotions}"
          class="max-w-3xl space-y-6" id="promoForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <!-- Datos básicos -->
        <div class="space-y-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Datos generales</h3>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Código (opcional)</label>
                    <input th:field="*{code}" type="text" maxlength="40"
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 font-mono text-sm"
                           placeholder="VERANO10"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Nombre</label>
                    <input th:field="*{name}" type="text" required
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Descripción</label>
                <textarea th:field="*{description}" rows="2"
                          class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Tipo de descuento</label>
                    <select th:field="*{promoType}" id="promoType"
                            class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                        <option th:each="t : ${promoTypes}" th:value="${t}" th:text="${t}">PERCENT</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Alcance (scope)</label>
                    <select th:field="*{scope}" id="promoScope"
                            class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                        <option th:each="s : ${scopes}" th:value="${s}" th:text="${s}">ORDER</option>
                    </select>
                </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div id="percentBox">
                    <label class="block text-sm font-medium text-slate-700">Porcentaje (%)</label>
                    <input th:field="*{discountPercent}" type="number" step="0.01" min="0" max="100"
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
                <div id="amountBox">
                    <label class="block text-sm font-medium text-slate-700">Monto fijo (S/)</label>
                    <input th:field="*{discountAmount}" type="number" step="0.01" min="0"
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
            </div>
        </div>

        <!-- Vigencia y reglas -->
        <div class="space-y-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Vigencia y reglas</h3>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Inicio</label>
                    <input th:field="*{startsAt}" type="datetime-local" required
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Fin</label>
                    <input th:field="*{endsAt}" type="datetime-local" required
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-3">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Prioridad</label>
                    <input th:field="*{priority}" type="number" required
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                    <p class="mt-1 text-xs text-slate-400">Menor número = mayor prioridad</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Pedido mínimo (S/)</label>
                    <input th:field="*{minOrderAmount}" type="number" step="0.01" min="0"
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Tope descuento (S/)</label>
                    <input th:field="*{maxDiscountAmount}" type="number" step="0.01" min="0"
                           class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Sede</label>
                <select th:field="*{branchId}"
                        class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <option th:value="${null}">Todas las sedes</option>
                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}">Sede</option>
                </select>
            </div>

            <div class="flex flex-wrap gap-6 text-sm">
                <label class="inline-flex items-center gap-2">
                    <input type="checkbox" th:field="*{automatic}" class="rounded border-slate-300 text-sky-600"/>
                    Aplicación automática
                </label>
                <label class="inline-flex items-center gap-2">
                    <input type="checkbox" th:field="*{stackable}" class="rounded border-slate-300 text-sky-600"/>
                    Acumulable con otras
                </label>
                <label class="inline-flex items-center gap-2">
                    <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600"/>
                    Activa
                </label>
            </div>
        </div>

        <!-- Productos (scope PRODUCT) -->
        <div id="productsBox" class="space-y-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Productos incluidos</h3>
            <p class="text-xs text-slate-500">Visible cuando el alcance es PRODUCT</p>
            <div class="max-h-56 space-y-1 overflow-y-auto">
                <label th:each="pr : ${products}"
                       class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-slate-50">
                    <input type="checkbox" th:field="*{productIds}" th:value="${pr.id}"
                           class="rounded border-slate-300 text-sky-600"/>
                    <span th:text="${pr.name}">Producto</span>
                </label>
            </div>
        </div>

        <!-- Categorías (scope CATEGORY) -->
        <div id="categoriesBox" class="space-y-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Categorías incluidas</h3>
            <p class="text-xs text-slate-500">Visible cuando el alcance es CATEGORY</p>
            <div class="max-h-56 space-y-1 overflow-y-auto">
                <label th:each="c : ${categories}"
                       class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-slate-50">
                    <input type="checkbox" th:field="*{categoryIds}" th:value="${c.id}"
                           class="rounded border-slate-300 text-sky-600"/>
                    <span th:text="${c.name}">Categoría</span>
                </label>
            </div>
        </div>

        <div th:if="${error}"
             class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <div class="flex flex-wrap gap-3">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/promotions}"
               class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Cancelar
            </a>
        </div>
    </form>
</section>

<th:block layout:fragment="scripts">
    <script>
        (function () {
            const typeSel = document.getElementById('promoType');
            const scopeSel = document.getElementById('promoScope');
            const percentBox = document.getElementById('percentBox');
            const amountBox = document.getElementById('amountBox');
            const productsBox = document.getElementById('productsBox');
            const categoriesBox = document.getElementById('categoriesBox');

            function syncType() {
                const t = typeSel ? typeSel.value : 'PERCENT';
                if (percentBox) percentBox.classList.toggle('opacity-50', t !== 'PERCENT');
                if (amountBox) amountBox.classList.toggle('opacity-50', t !== 'AMOUNT');
            }
            function syncScope() {
                const s = scopeSel ? scopeSel.value : 'ORDER';
                if (productsBox) productsBox.style.display = (s === 'PRODUCT') ? '' : 'none';
                if (categoriesBox) categoriesBox.style.display = (s === 'CATEGORY') ? '' : 'none';
            }
            if (typeSel) typeSel.addEventListener('change', syncType);
            if (scopeSel) scopeSel.addEventListener('change', syncScope);
            syncType();
            syncScope();
        })();
    </script>
</th:block>
</body>
</html>
