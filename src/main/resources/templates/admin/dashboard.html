<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head>
    <title>Panel de control</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6">
        <h1 class="text-xl font-bold text-slate-900">Panel de control</h1>
        <p class="text-sm text-slate-500">Resumen del día</p>
    </div>

    <div class="mb-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Pedidos hoy</p>
            <p class="mt-2 text-3xl font-bold text-slate-900"
               th:text="${kpi != null ? kpi.ordersToday() : 0}">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Ventas hoy</p>
            <p class="mt-2 text-3xl font-bold text-sky-700"
               th:text="${kpi != null}
                 ? ${'S/ ' + #numbers.formatDecimal(kpi.salesToday(), 1, 2)}
                 : 'S/ 0.00'">S/ 0.00</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Pendientes</p>
            <p class="mt-2 text-3xl font-bold text-amber-600"
               th:text="${kpi != null ? kpi.pendingOrders() : 0}">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Stock bajo</p>
            <p class="mt-2 text-3xl font-bold text-slate-900"
               th:text="${kpi != null ? kpi.lowStockCount() : 0}">0</p>
        </div>
    </div>

    <div class="grid gap-6 lg:grid-cols-3">
        <div class="lg:col-span-2 rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
                <h2 class="font-semibold text-slate-900">Últimos pedidos</h2>
                <a th:href="@{/admin/orders}" class="text-sm font-medium text-sky-600 hover:underline">Ver todos</a>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                    <tr>
                        <th class="px-5 py-3">#</th>
                        <th class="px-5 py-3">Cliente</th>
                        <th class="px-5 py-3">Estado</th>
                        <th class="px-5 py-3">Total</th>
                        <th class="px-5 py-3">Fecha</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${kpi != null ? kpi.recentOrders() : {}}"
                        class="border-t border-slate-100 hover:bg-slate-50">
                        <td class="px-5 py-3">
                            <a th:href="@{/admin/orders/{id}(id=${o.id()})}"
                               class="font-medium text-sky-600 hover:underline"
                               th:text="${o.id()}">1</a>
                        </td>
                        <td class="px-5 py-3" th:text="${o.customerName()}">—</td>
                        <td class="px-5 py-3" th:text="${o.statusName()}">—</td>
                        <td class="px-5 py-3"
                            th:text="${'S/ ' + #numbers.formatDecimal(o.total(), 1, 2)}">S/ 0</td>
                        <td class="px-5 py-3 text-slate-500" th:text="${o.orderedAtLabel()}">—</td>
                    </tr>
                    <tr th:if="${kpi == null or #lists.isEmpty(kpi.recentOrders())}">
                        <td colspan="5" class="px-5 py-10 text-center text-slate-500">
                            Aún no hay pedidos
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h2 class="font-semibold text-slate-900">Accesos rápidos</h2>
            <ul class="mt-4 space-y-2 text-sm">
                <li>
                    <a th:href="@{/admin/daily-menus}"
                       class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-700 hover:bg-sky-50 hover:text-sky-700">
                        <i class="bi bi-calendar-day"></i> Menú del día
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/orders}"
                       class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-700 hover:bg-sky-50 hover:text-sky-700">
                        <i class="bi bi-bag"></i> Pedidos
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/products}"
                       class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-700 hover:bg-sky-50 hover:text-sky-700">
                        <i class="bi bi-box"></i> Productos
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/stock}"
                       class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-700 hover:bg-sky-50 hover:text-sky-700">
                        <i class="bi bi-boxes"></i> Stock
                    </a>
                </li>
            </ul>
        </div>
    </div>
</section>
</body>
</html>
