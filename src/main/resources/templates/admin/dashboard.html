<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Dashboard</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>
                <p class="text-sm text-slate-500">Resumen operativo de hoy</p>
            </div>
            <form method="get" th:action="@{/admin/dashboard}" class="flex gap-2">
                <select name="sedeId" class="input w-52" onchange="this.form.submit()">
                    <option value="">Todas las sedes</option>
                    <option th:each="s : ${sedes}" th:value="${s.id}" th:text="${s.nombre}"
                            th:selected="${sedeId != null and sedeId == s.id}"></option>
                </select>
            </form>
        </div>

        <!-- KPIs -->
        <div class="mb-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="card p-5">
                <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Pedidos hoy</p>
                <p class="mt-2 text-3xl font-bold text-slate-900"
                   th:text="${dashboard.pedidosHoy}">0</p>
            </div>
            <div class="card p-5">
                <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Ventas hoy</p>
                <p class="mt-2 text-3xl font-bold text-sky-700"
                   th:text="'S/ ' + ${#numbers.formatDecimal(dashboard.ventasHoy,1,2)}">S/ 0.00</p>
            </div>
            <div class="card p-5">
                <p class="text-xs font-medium uppercase tracking-wide text-slate-400">En cocina / listos</p>
                <p class="mt-2 text-3xl font-bold text-amber-600"
                   th:text="${dashboard.pedidosPendientesCocina}">0</p>
            </div>
            <div class="card p-5">
                <p class="text-xs font-medium uppercase tracking-wide text-slate-400">En camino</p>
                <p class="mt-2 text-3xl font-bold text-emerald-600"
                   th:text="${dashboard.pedidosEnCamino}">0</p>
            </div>
        </div>

        <div class="grid gap-6 lg:grid-cols-2">
            <!-- Por estado -->
            <div class="card p-5">
                <h2 class="mb-4 font-semibold">Pedidos de hoy por estado</h2>
                <div th:if="${#lists.isEmpty(dashboard.pedidosPorEstado)}" class="text-sm text-slate-400">
                    Sin pedidos hoy
                </div>
                <ul class="space-y-2">
                    <li th:each="e : ${dashboard.pedidosPorEstado}"
                        class="flex justify-between text-sm border-b border-slate-50 pb-2">
                        <span class="badge" th:text="${e.estado}"></span>
                        <strong th:text="${e.cantidad}"></strong>
                    </li>
                </ul>
            </div>

            <!-- Stock bajo -->
            <div class="card p-5">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="font-semibold">Alertas de stock</h2>
                    <a th:href="@{/admin/stock}" class="text-sm text-sky-700">Ver stock</a>
                </div>
                <div th:if="${#lists.isEmpty(dashboard.stockBajo)}" class="text-sm text-emerald-600">
                    Sin alertas
                </div>
                <ul class="space-y-2">
                    <li th:each="s : ${dashboard.stockBajo}"
                        class="flex justify-between text-sm text-red-700">
                        <span th:text="${s.insumoNombre} + ' (' + ${s.sedeNombre} + ')'"></span>
                        <span th:text="${s.disponibleNeto} + ' ' + ${s.unidad}"></span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Últimos pedidos -->
        <div class="card mt-6 overflow-x-auto">
            <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
                <h2 class="font-semibold">Últimos pedidos</h2>
                <a th:href="@{/cocina/pedidos}" class="text-sm text-sky-700">Ir a cocina</a>
            </div>
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-2">#</th>
                    <th class="px-4 py-2">Fecha</th>
                    <th class="px-4 py-2">Sede</th>
                    <th class="px-4 py-2">Estado</th>
                    <th class="px-4 py-2">Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${dashboard.ultimosPedidos}" class="border-t border-slate-50">
                    <td class="px-4 py-2 font-medium" th:text="${p.id}"></td>
                    <td class="px-4 py-2"
                        th:text="${#temporals.format(p.fechaPedido, 'dd/MM HH:mm')}"></td>
                    <td class="px-4 py-2" th:text="${p.sedeNombre}"></td>
                    <td class="px-4 py-2"><span class="badge" th:text="${p.estado}"></span></td>
                    <td class="px-4 py-2 text-sky-700 font-semibold"
                        th:text="'S/ ' + ${#numbers.formatDecimal(p.total,1,2)}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Atajos -->
        <div class="mt-8 flex flex-wrap gap-3">
            <a th:href="@{/admin/menus}" class="btn-secondary">Menú del día</a>
            <a th:href="@{/admin/productos}" class="btn-secondary">Productos</a>
            <a th:href="@{/admin/stock}" class="btn-secondary">Stock</a>
            <a th:href="@{/admin/promociones}" class="btn-secondary">Promociones</a>
        </div>
    </section>
</main>
</body>
</html>
