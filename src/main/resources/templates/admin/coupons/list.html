<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Cupones</title></head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Cupones</h1>
            <p class="text-sm text-slate-500">Códigos de descuento para el checkout</p>
        </div>
        <a sec:authorize="hasAuthority('PERM_COUPONS_MANAGE')"
           th:href="@{/admin/coupons/new}"
           class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
            <i class="bi bi-plus-lg"></i> Nuevo
        </a>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Código</th>
                <th class="px-4 py-3">Descuento</th>
                <th class="px-4 py-3">Usos</th>
                <th class="px-4 py-3">Vigencia</th>
                <th class="px-4 py-3">Estado</th>
                <th class="px-4 py-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${coupons}" class="border-b border-slate-100">
                <td class="px-4 py-3">
                    <span class="font-mono font-semibold" th:text="${c.code()}"></span>
                    <p class="text-xs text-slate-400" th:text="${c.description()}"></p>
                </td>
                <td class="px-4 py-3"
                    th:text="${c.discountType() == 'PERCENT'
                        ? c.discountValue() + '%'
                        : 'S/ ' + #numbers.formatDecimal(c.discountValue(), 1, 2)}"></td>
                <td class="px-4 py-3"
                    th:text="${c.usedCount() + (c.maxUses() != null ? ' / ' + c.maxUses() : '')}"></td>
                <td class="px-4 py-3 text-xs text-slate-500">
                    <span th:text="${#temporals.format(c.startsAt(), 'dd/MM/yyyy HH:mm')}"></span>
                    →
                    <span th:text="${#temporals.format(c.endsAt(), 'dd/MM/yyyy HH:mm')}"></span>
                </td>
                <td class="px-4 py-3">
                    <span th:if="${c.active()}" class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700">Activo</span>
                    <span th:unless="${c.active()}" class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">Inactivo</span>
                </td>
                <td class="px-4 py-3 text-right space-x-2">
                    <a sec:authorize="hasAuthority('PERM_COUPONS_MANAGE')"
                       th:href="@{/admin/coupons/{id}/edit(id=${c.id()})}"
                       class="text-sky-600 hover:underline">Editar</a>
                    <form sec:authorize="hasAuthority('PERM_COUPONS_MANAGE')"
                          th:if="${c.active()}"
                          th:action="@{/admin/coupons/{id}/deactivate(id=${c.id()})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="text-red-600 hover:underline">Desactivar</button>
                    </form>
                    <form sec:authorize="hasAuthority('PERM_COUPONS_MANAGE')"
                          th:unless="${c.active()}"
                          th:action="@{/admin/coupons/{id}/activate(id=${c.id()})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="text-emerald-600 hover:underline">Activar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(coupons)}">
                <td colspan="6" class="px-4 py-10 text-center text-slate-500">Sin cupones</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
