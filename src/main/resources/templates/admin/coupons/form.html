<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}" lang="es">
<head><title>Cupón</title></head>
<body>
<section layout:fragment="content">
    <h1 class="mb-6 text-xl font-bold text-slate-900" th:text="${titulo}">Cupón</h1>

    <form th:action="${form.id() == null} ? @{/admin/coupons} : @{/admin/coupons/{id}(id=${form.id()})}"
          th:object="${form}" method="post"
          class="max-w-xl space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="mb-1 block text-sm font-medium">Código</label>
            <input type="text" th:field="*{code}" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm uppercase
                          focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                   placeholder="BIENVENIDO10">
            <p class="text-xs text-red-600" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">Descripción</label>
            <input type="text" th:field="*{description}"
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-sm font-medium">Tipo</label>
                <select th:field="*{discountType}" required
                        class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                    <option th:each="t : ${discountTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium">Valor</label>
                <input type="number" step="0.01" min="0.01" th:field="*{discountValue}" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-sm font-medium">Pedido mínimo (S/)</label>
                <input type="number" step="0.01" min="0" th:field="*{minOrderAmount}"
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium">Máx. usos (vacío = ilimitado)</label>
                <input type="number" min="1" th:field="*{maxUses}"
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-sm font-medium">Inicio</label>
                <input type="datetime-local" name="startsAt"
                       th:value="${form.startsAt() != null} ? ${#temporals.format(form.startsAt(), 'yyyy-MM-dd''T''HH:mm')} : ''"
                       required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium">Fin</label>
                <input type="datetime-local" name="endsAt"
                       th:value="${form.endsAt() != null} ? ${#temporals.format(form.endsAt(), 'yyyy-MM-dd''T''HH:mm')} : ''"
                       required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            </div>
        </div>

        <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600">
            Activo
        </label>

        <div class="flex gap-2 pt-2">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/coupons}" class="rounded-xl px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
