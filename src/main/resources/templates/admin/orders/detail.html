<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title>Detalle pedido</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <a th:href="@{/admin/orders}" class="text-sm text-sky-600 hover:underline">← Pedidos</a>
            <h1 class="mt-1 text-xl font-bold text-slate-900">
                Pedido #<span th:text="${order.id()}"></span>
            </h1>
            <p class="text-sm text-slate-500" th:text="${order.orderedAtLabel()}"></p>
        </div>
        <span class="rounded-full bg-sky-50 px-3 py-1 text-sm font-semibold text-sky-700" th:text="${order.statusName()}"></span>
    </div>

    <div class="grid gap-6 lg:grid-cols-3">
        <div class="space-y-4 lg:col-span-2">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold text-slate-900">Ítems</h2>
                <ul class="mt-3 divide-y divide-slate-100 text-sm">
                    <li th:each="i : ${order.items()}" class="flex justify-between gap-2 py-2">
                        <span th:text="${i.quantity() + ' × ' + i.productName()}"></span>
                        <span th:text="${'S/ ' + #numbers.formatDecimal(i.lineTotal(), 1, 2)}"></span>
                    </li>
                </ul>
                <dl class="mt-4 space-y-1 border-t border-slate-100 pt-3 text-sm">
                    <div class="flex justify-between">
                        <dt class="text-slate-500">Subtotal</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(order.subtotal(), 1, 2)}"></dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-slate-500">Delivery</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(order.deliveryFee(), 1, 2)}"></dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-slate-500">Descuento</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(order.discount(), 1, 2)}"></dd>
                    </div>
                    <div class="flex justify-between text-base font-bold">
                        <dt>Total</dt>
                        <dd th:text="${'S/ ' + #numbers.formatDecimal(order.total(), 1, 2)}"></dd>
                    </div>
                </dl>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="font-semibold text-slate-900">Historial</h2>
                <ol class="mt-3 space-y-2 text-sm">
                    <li th:each="h : ${order.history()}" class="flex gap-3 border-l-2 border-sky-200 pl-3">
                        <div>
                            <p class="font-medium" th:text="${h.statusName()}"></p>
                            <p class="text-xs text-slate-500"
                               th:text="${h.createdAtLabel() + (h.userName() != null ? ' · ' + h.userName() : '')}"></p>
                            <p class="text-xs text-slate-600" th:if="${h.notes() != null}" th:text="${h.notes()}"></p>
                        </div>
                    </li>
                </ol>
            </div>
        </div>

        <div class="space-y-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm text-sm">
                <h2 class="font-semibold text-slate-900">Cliente</h2>
                <p class="mt-2" th:text="${order.customerName()}"></p>
                <p class="text-slate-500" th:text="${order.customerEmail()}"></p>
                <h2 class="mt-4 font-semibold text-slate-900">Entrega</h2>
                <p class="mt-1" th:text="${order.branchName()}"></p>
                <p class="text-slate-600" th:text="${order.addressLine()}"></p>
                <p class="text-xs text-slate-400" th:text="${order.districtName()}"></p>
                <p class="mt-2 text-amber-700" th:if="${order.notes() != null}" th:text="${'Nota: ' + order.notes()}"></p>
                <p class="mt-1 text-xs" th:if="${order.couponCode() != null}" th:text="${'Cupón: ' + order.couponCode()}"></p>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm text-sm" th:if="${order.payments() != null and !#lists.isEmpty(order.payments())}">
                <h2 class="font-semibold text-slate-900">Pagos</h2>
                <ul class="mt-2 space-y-2">
                    <li th:each="p : ${order.payments()}" class="flex justify-between">
                        <span>
                            <span th:text="${p.methodName()}"></span>
                            <span class="text-xs text-slate-500" th:text="${' · ' + p.status()}"></span>
                        </span>
                        <span th:text="${'S/ ' + #numbers.formatDecimal(p.amount(), 1, 2)}"></span>
                    </li>
                </ul>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
                 sec:authorize="hasAuthority('PERM_ORDERS_STATUS')">
                <h2 class="font-semibold text-slate-900">Cambiar estado</h2>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id()})}" method="post" class="mt-3 space-y-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <select name="status" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.name}" th:selected="${s.code == order.statusCode()}"></option>
                    </select>
                    <button type="submit" class="w-full rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">
                        Actualizar
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
