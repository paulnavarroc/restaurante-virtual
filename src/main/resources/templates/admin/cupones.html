<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Promociones</title></head>
<body>
<main layout:fragment="content">

    <form th:action="@{/admin/cupones}" th:object="${cupon}" method="post" class="card mb-8 grid gap-3 p-4 md:grid-cols-2">
        <select th:field="*{promocionId}" class="input" required>
            <option value="">Promoción</option>
            <option th:each="p : ${promociones}" th:value="${p.id}"
                    th:text="${p.nombre} + ' (' + ${p.tipo} + ')'"></option>
        </select>
        <input th:field="*{codigo}" class="input" placeholder="CODIGO" required>
        <input type="number" th:field="*{usoMaxGlobal}" class="input" placeholder="Máx. global">
        <input type="number" th:field="*{usoMaxPorCliente}" class="input" placeholder="Máx. por cliente">
        <button class="btn-primary md:col-span-2">Crear cupón</button>
    </form>

</main>
</body>
</html>
