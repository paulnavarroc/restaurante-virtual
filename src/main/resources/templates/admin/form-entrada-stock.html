<form th:action="@{/admin/stock/entrada}" th:object="${entrada}" method="post" class="card space-y-4 p-6">
    <select th:field="*{sedeId}" class="input" required>...</select>
    <select th:field="*{insumoId}" class="input" required>...</select>
    <input type="number" step="0.0001" th:field="*{cantidad}" class="input" required>
    <input type="number" step="0.01" th:field="*{costoUnitario}" class="input">
    <input type="text" th:field="*{observacion}" class="input">
    <button class="btn-primary">Registrar entrada</button>
</form>
