<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title th:text="${form.id != null} ? 'Editar grupo' : 'Nuevo grupo'">Grupo</title>
</head>
<body>
<th:block layout:fragment="pageTitle" th:text="${form.id != null} ? 'Editar grupo' : 'Nuevo grupo'">Grupo</th:block>

<section layout:fragment="content">
    <a th:href="@{/admin/security}" class="text-sm font-medium text-sky-600 hover:underline">← Volver</a>
    <h2 class="mt-2 mb-6 text-xl font-bold text-slate-900"
        th:text="${form.id != null} ? 'Editar grupo de permisos' : 'Nuevo grupo'">Grupo</h2>

    <form th:object="${form}" method="post"
          th:action="${form.id != null}
              ? @{/admin/security/groups/{id}(id=${form.id})}
              : @{/admin/security/groups}"
          class="max-w-3xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Código</label>
                <input th:field="*{code}" type="text" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 font-mono text-sm"
                       placeholder="GESTION_PRODUCTOS"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Nombre</label>
                <input th:field="*{name}" type="text" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Descripción</label>
                <textarea th:field="*{description}" rows="2"
                          class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
            </div>
            <label class="inline-flex items-center gap-2 text-sm">
                <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600"/>
                Grupo activo
            </label>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Permisos del grupo</h3>
            <div class="mt-4 max-h-96 space-y-1 overflow-y-auto">
                <label th:each="p : ${allPermissions}"
                       class="flex items-start gap-2 rounded-lg px-2 py-1.5 hover:bg-slate-50">
                    <input type="checkbox" th:field="*{permissionIds}" th:value="${p.id}"
                           class="mt-1 rounded border-slate-300 text-sky-600"/>
                    <span>
                        <span class="font-mono text-xs" th:text="${p.code}"></span>
                        <span class="ml-2 text-sm text-slate-600" th:text="${p.description}"></span>
                    </span>
                </label>
            </div>
        </div>

        <div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <div class="flex gap-3">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/security}"
               class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm text-slate-700 hover:bg-slate-50">
                Cancelar
            </a>
        </div>
    </form>
</section>
</body>
</html>
