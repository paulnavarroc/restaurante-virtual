<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}"
      lang="es">
<head>
    <title th:text="${form.id != null} ? 'Editar rol' : 'Nuevo rol'">Rol</title>
</head>
<body>
<th:block layout:fragment="pageTitle" th:text="${form.id != null} ? 'Editar rol' : 'Nuevo rol'">Rol</th:block>

<section layout:fragment="content">
    <a th:href="@{/admin/security}" class="text-sm font-medium text-sky-600 hover:underline">← Volver a seguridad</a>
    <h2 class="mt-2 mb-6 text-xl font-bold text-slate-900"
        th:text="${form.id != null} ? 'Editar rol' : 'Nuevo rol'">Rol</h2>

    <form th:object="${form}" method="post"
          th:action="${form.id != null}
              ? @{/admin/security/roles/{id}(id=${form.id})}
              : @{/admin/security/roles}"
          class="max-w-3xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Nombre del rol</label>
                <input th:field="*{name}" type="text" required
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"
                       placeholder="OPERATIONS"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-red-600"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Descripción</label>
                <input th:field="*{description}" type="text"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"/>
            </div>
            <label class="inline-flex items-center gap-2 text-sm">
                <input type="checkbox" th:field="*{active}" class="rounded border-slate-300 text-sky-600"/>
                Rol activo
            </label>
        </div>

        <!-- Grupos -->
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Grupos de permisos</h3>
            <p class="mt-1 text-xs text-slate-500">El rol hereda todos los permisos de los grupos marcados</p>
            <div class="mt-4 grid gap-2 sm:grid-cols-2">
                <label th:each="g : ${allGroups}"
                       class="flex items-start gap-2 rounded-lg border border-slate-100 px-3 py-2 hover:bg-slate-50">
                    <input type="checkbox" th:field="*{permissionGroupIds}" th:value="${g.id}"
                           class="mt-1 rounded border-slate-300 text-sky-600"/>
                    <span>
                        <span class="block text-sm font-medium" th:text="${g.name}">Grupo</span>
                        <span class="block font-mono text-[11px] text-slate-400" th:text="${g.code}"></span>
                    </span>
                </label>
            </div>
        </div>

        <!-- Overrides ALLOW / DENY por permiso individual -->
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 class="font-semibold text-slate-900">Permisos individuales del rol</h3>
            <p class="mt-1 text-xs text-slate-500">
                Opcional. DENY gana sobre ALLOW y sobre lo heredado de grupos.
                Valor enviado: <code class="text-[11px]">ALLOW:CODE</code> o <code class="text-[11px]">DENY:CODE</code>
            </p>
            <div class="mt-4 max-h-80 overflow-y-auto space-y-2">
                <div th:each="p : ${allPermissions}"
                     class="flex flex-wrap items-center justify-between gap-2 rounded-lg border border-slate-100 px-3 py-2 text-sm">
                    <div>
                        <span class="font-mono text-xs" th:text="${p.code}">USERS_VIEW</span>
                        <span class="ml-2 text-slate-500" th:text="${p.description}"></span>
                    </div>
                    <div class="flex gap-3 text-xs">
                        <label class="inline-flex items-center gap-1">
                            <input type="checkbox" name="permissionOverrides"
                                   th:value="${'ALLOW:' + p.code}"
                                   th:checked="${form.permissionOverrides != null and form.permissionOverrides.contains('ALLOW:' + p.code)}"
                                   class="rounded border-slate-300 text-emerald-600"/>
                            ALLOW
                        </label>
                        <label class="inline-flex items-center gap-1">
                            <input type="checkbox" name="permissionOverrides"
                                   th:value="${'DENY:' + p.code}"
                                   th:checked="${form.permissionOverrides != null and form.permissionOverrides.contains('DENY:' + p.code)}"
                                   class="rounded border-slate-300 text-red-600"/>
                            DENY
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
             th:text="${error}"></div>

        <div class="flex gap-3">
            <button type="submit"
                    class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">
                Guardar
            </button>
            <a th:href="@{/admin/security}"
               class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Cancelar
            </a>
        </div>
    </form>
</section>
</body>
</html>
