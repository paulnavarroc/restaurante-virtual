<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Carrito</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <h1 class="mb-6 text-2xl font-bold text-slate-900">Mi carrito</h1>

        <div th:if="${carrito == null or carrito.empty}" class="card px-6 py-16 text-center">
            <i class="bi bi-cart-x text-4xl text-slate-300"></i>
            <p class="mt-3 text-slate-500">Tu carrito está vacío</p>
            <a th:href="@{/menu}" class="btn-primary mt-5 inline-flex">Ver menú</a>
        </div>

        <div th:if="${carrito != null and !carrito.empty}" class="grid gap-6 lg:grid-cols-3">
            <div class="card overflow-hidden lg:col-span-2">
                <div th:each="item : ${carrito.items}" class="flex gap-4 border-b border-slate-100 p-4 last:border-0">
                    <img th:src="${item.imagenUrl}" class="h-20 w-20 rounded-xl object-cover" th:alt="${item.nombre}">
                    <div class="flex flex-1 flex-col justify-between">
                        <div>
                            <h3 class="font-semibold" th:text="${item.nombre}"></h3>
                            <p class="text-xs text-slate-400" th:text="${item.region}"></p>
                            <p class="text-sm text-sky-700" th:text="'S/ ' + ${item.precio}"></p>
                        </div>
                        <div class="mt-2 flex items-center gap-2">
                            <form th:action="@{/cliente/carrito/actualizar}" method="post" class="flex items-center gap-1">
                                <input type="hidden" name="productoId" th:value="${item.productoId}">
                                <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" max="20" class="input !w-16 !py-1">
                                <button class="btn-secondary !px-2 !py-1 !text-xs">OK</button>
                            </form>
                            <form th:action="@{/cliente/carrito/eliminar}" method="post">
                                <input type="hidden" name="productoId" th:value="${item.productoId}">
                                <button class="btn-ghost !text-red-600"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                    <strong class="text-slate-800" th:text="'S/ ' + ${item.subtotal}"></strong>
                </div>
            </div>

            <div class="card h-fit p-5">
                <h2 class="mb-4 font-bold text-slate-900">Resumen</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between"><span class="text-slate-500">Subtotal</span>
                        <span th:text="'S/ ' + ${carrito.subtotal}"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Delivery</span>
                        <span th:text="${carrito.costoDelivery.compareTo(T(java.math.BigDecimal).ZERO) == 0} ? 'Gratis' : 'S/ ' + ${carrito.costoDelivery}"></span>
                    </div>
                    <div class="flex justify-between border-t border-slate-100 pt-2 text-base font-bold">
                        <span>Total</span>
                        <span class="text-sky-700" th:text="'S/ ' + ${carrito.total}"></span>
                    </div>
                </div>
                <a th:href="@{/cliente/carrito/checkout}" class="btn-primary mt-5 w-full">Continuar pedido</a>
                <a th:href="@{/menu}" class="btn-secondary mt-2 w-full">Seguir comprando</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
