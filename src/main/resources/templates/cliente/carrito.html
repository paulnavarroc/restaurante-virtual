<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Carrito</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <h1 class="mb-6 text-2xl font-bold">Mi carrito</h1>

        <div th:if="${carrito == null or carrito.empty}" class="card px-6 py-16 text-center">
            <p class="text-slate-500">Tu carrito está vacío</p>
            <a th:href="@{/menu}" class="btn-primary mt-5 inline-flex">Ver menú</a>
        </div>

        <div th:if="${carrito != null and !carrito.empty}" class="grid gap-6 lg:grid-cols-3">
            <div class="card overflow-hidden lg:col-span-2">
                <div th:each="item : ${carrito.items}" class="flex gap-4 border-b border-slate-100 p-4 last:border-0">
                    <div class="flex flex-1 flex-col gap-2">
                        <h3 class="font-semibold" th:text="${item.nombre}">Plato</h3>
                        <p class="text-sm text-sky-700"
                           th:text="'S/ ' + ${#numbers.formatDecimal(item.precioUnitario,1,2)}"></p>
                        <div class="flex items-center gap-2">
                            <form th:action="@{/cliente/carrito/actualizar}" method="post" class="flex gap-1">
                                <input type="hidden" name="menuDiaItemId" th:value="${item.menuDiaItemId}">
                                <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" max="20"
                                       class="input !w-16 !py-1">
                                <button class="btn-secondary !text-xs">OK</button>
                            </form>
                            <form th:action="@{/cliente/carrito/eliminar}" method="post">
                                <input type="hidden" name="menuDiaItemId" th:value="${item.menuDiaItemId}">
                                <button type="submit" class="btn-ghost !text-red-600 text-sm">Quitar</button>
                            </form>
                        </div>
                    </div>
                    <strong th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal,1,2)}"></strong>
                </div>
            </div>

            <div class="card h-fit p-5">
                <h2 class="mb-4 font-bold">Resumen</h2>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500">Subtotal</span>
                    <span th:text="'S/ ' + ${#numbers.formatDecimal(carrito.subtotal,1,2)}"></span>
                </div>
                <p class="mt-2 text-xs text-slate-400">Delivery se calcula en el checkout según tu dirección.</p>
                <a th:href="@{/cliente/carrito/checkout}" class="btn-primary mt-5 w-full">Continuar</a>
                <a th:href="@{/menu}" class="btn-secondary mt-2 w-full">Seguir comprando</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
