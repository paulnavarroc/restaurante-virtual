<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Checkout</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-6xl px-4 py-10">
        <h1 class="mb-6 text-2xl font-bold">Confirmar pedido</h1>

        <div class="grid gap-6 lg:grid-cols-2">
            <div class="card p-5">
                <h2 class="mb-4 font-semibold">Tu pedido</h2>
                <div th:each="item : ${carrito.items}" class="flex justify-between border-b border-slate-50 py-2 text-sm">
                    <span th:text="${item.cantidad} + '× ' + ${item.nombre}"></span>
                    <span th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal,1,2)}"></span>
                </div>
                <div class="mt-4 flex justify-between font-semibold">
                    <span>Subtotal</span>
                    <span class="text-sky-700"
                          th:text="'S/ ' + ${#numbers.formatDecimal(carrito.subtotal,1,2)}"></span>
                </div>
            </div>

            <div class="card p-5">
                <form th:action="@{/cliente/carrito/confirmar}" method="post" class="space-y-4">
                    <div>
                        <label class="mb-1.5 block text-sm font-medium">Dirección *</label>
                        <select name="direccionId" required class="input">
                            <option value="">Selecciona</option>
                            <option th:each="d : ${direcciones}"
                                    th:value="${d.id}"
                                    th:selected="${d.esPrincipal}"
                                    th:text="${d.resumen}"></option>
                        </select>
                        <a th:href="@{/cliente/direcciones/nueva}" class="mt-1 inline-block text-xs text-sky-700">
                            + Nueva dirección
                        </a>
                    </div>
                    <input type="text" name="codigoCupon" class="input" placeholder="Código de descuento">
                    <div>
                        <label class="mb-1.5 block text-sm font-medium">Método de pago *</label>
                        <select name="metodoPagoId" required class="input">
                            <option value="1">Efectivo</option>
                            <option value="2">Tarjeta</option>
                            <option value="3">Yape</option>
                            <option value="4">Plin</option>
                            <option value="5">Transferencia</option>
                        </select>
                    </div>
                    <div>
                        <label class="mb-1.5 block text-sm font-medium">Observaciones</label>
                        <textarea name="observaciones" rows="3" class="input"
                                  placeholder="Indicaciones al repartidor..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary w-full">Confirmar pedido</button>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>
