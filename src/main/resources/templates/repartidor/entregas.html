<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">
<head><title>Entregas</title></head>
<body>
<main layout:fragment="content">
    <section class="mx-auto max-w-4xl px-4 py-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold">Mis entregas</h1>
            <div class="flex gap-2">
                <form th:action="@{/repartidor/disponible}" method="post">
                    <button class="btn-primary !text-sm">Disponible</button>
                </form>
                <form th:action="@{/repartidor/offline}" method="post">
                    <button class="btn-secondary !text-sm">Offline</button>
                </form>
            </div>
        </div>

        <div th:if="${entregas == null or #lists.isEmpty(entregas)}"
             class="card py-12 text-center text-slate-500">
            No hay entregas por ahora.
        </div>

        <div class="space-y-4">
            <article th:each="e : ${entregas}" class="card p-5">
                <div class="flex flex-wrap items-start justify-between gap-3">
                    <div>
                        <div class="flex items-center gap-2">
                            <strong th:text="'Pedido #' + ${e.pedidoId}">#1</strong>
                            <span class="badge" th:text="${e.estadoEntrega}">ASIGNADA</span>
                        </div>
                        <p class="mt-1 text-sm text-slate-600" th:text="${e.clienteNombre}"></p>
                        <p class="text-sm font-medium" th:text="${e.direccion}"></p>
                        <p class="mt-1 text-sky-700 font-semibold"
                           th:text="'S/ ' + ${#numbers.formatDecimal(e.total,1,2)}"></p>
                        <ul class="mt-2 text-xs text-slate-500">
                            <li th:each="i : ${e.items}"
                                th:text="${i.cantidad} + '× ' + ${i.nombreProducto}"></li>
                        </ul>
                    </div>
                    <div class="flex flex-col gap-2">
                        <form th:if="${e.estadoEntrega == 'PENDIENTE_ASIGNACION'}"
                              th:action="@{/repartidor/entrega/{id}/tomar(id=${e.id})}" method="post">
                            <button class="btn-primary !text-sm w-full">Tomar</button>
                        </form>
                        <form th:if="${e.estadoEntrega == 'ASIGNADA'}"
                              th:action="@{/repartidor/entrega/{id}/en-camino(id=${e.id})}" method="post">
                            <button class="btn-primary !text-sm w-full">En camino</button>
                        </form>
                        <form th:if="${e.estadoEntrega == 'EN_CAMINO' or e.estadoEntrega == 'ASIGNADA'}"
                              th:action="@{/repartidor/entrega/{id}/entregada(id=${e.id})}" method="post">
                            <button class="btn-secondary !text-sm w-full">Entregado</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
