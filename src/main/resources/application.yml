spring:
  application:
    name: restaurante-virtual
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    format:
      date-time: yyyy-MM-dd'T'HH:mm

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  media-root: ${MEDIA_ROOT:./uploads}
  media-productos-dir: productos
  media-max-size-bytes: 5242880   # 5 MB